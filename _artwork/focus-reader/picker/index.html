<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex"><base href="/focus-reader/picker/" target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Opened by the Focus Reader app to show Google's file picker.">
<link rel="canonical" href="https://nomadjames.com/focus-reader/picker/">
<title>Focus Reader: choose from Google Drive</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1218; color: #d8dce4;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  p { max-width: 30em; padding: 0 1.5em; text-align: center; }
  a { color: #f0a050; }
</style>
</head>
<body>
<p id="msg">Opening Google Drive…</p>
<script>
// Focus Reader opens this page to show Google's file picker, which only runs on the web.
// The app's sign-in arrives after the #, so it is never sent to this site's server.
const p = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, "", location.pathname);
const token = p.get("token"), key = p.get("key"), appId = p.get("app"), back = p.get("back");
const msg = document.getElementById("msg");
function finish(query) {
  if (back && back.startsWith("focusreader://")) location.href = back + "?" + query;
  else msg.textContent = "Done. You can close this page.";
}
function start() {
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes("application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/markdown,text/x-markdown,text/plain")
    .setIncludeFolders(true)
    .setMode(google.picker.DocsViewMode.LIST);
  new google.picker.PickerBuilder()
    .addView(view)
    .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .setOAuthToken(token).setDeveloperKey(key).setAppId(appId)
    .setTitle("Add to Focus Reader")
    .setCallback(d => {
      if (d.action === google.picker.Action.PICKED) finish("ids=" + d.docs.map(x => x.id).join(","));
      else if (d.action === google.picker.Action.CANCEL) finish("cancel=1");
    })
    .build().setVisible(true);
}
if (!token || !key || !appId) {
  msg.textContent = "Open this page from Focus Reader: + > From Google Drive.";
} else {
  const s = document.createElement("script");
  s.src = "https://apis.google.com/js/api.js";
  s.onload = () => gapi.load("picker", start);
  s.onerror = () => { msg.textContent = "Google Drive didn't load. Check the connection, then try again from Focus Reader."; };
  document.head.appendChild(s);
}
</script>
</body>
</html>
