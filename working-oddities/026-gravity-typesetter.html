<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravity Typesetter</title><style>
:root{--paper:#efe9db;--ink:#191817;--plum:#7e315e;--gray:#a39a8b;--serif:Georgia,serif;--mono:ui-monospace,monospace;--sans:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow-x:hidden}.bar{padding:18px 4vw;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;font:11px var(--mono);text-transform:uppercase}.bar strong{color:var(--plum)}.layout{max-width:1180px;margin:auto;padding:45px 4vw;display:grid;grid-template-columns:280px 1fr;gap:50px}.tools{position:sticky;top:25px;align-self:start}.tools h1{font:500 46px/.86 var(--serif);letter-spacing:-.05em;margin:0 0 18px}.tools p{font-size:13px;line-height:1.5}.toolbox{margin-top:35px;border-top:2px solid var(--ink);padding-top:15px}.toolbox label{display:block;font:11px var(--mono);text-transform:uppercase;margin:14px 0 6px}.toolbox input,.toolbox textarea{width:100%;background:transparent;border:1px solid var(--gray);padding:8px;font:13px var(--mono)}textarea{resize:vertical;min-height:72px}.buttons{display:flex;gap:8px;margin-top:12px}button{background:var(--ink);color:var(--paper);border:0;padding:10px 12px;font:11px var(--mono);cursor:pointer}button:hover{background:var(--plum)}.typeset{position:relative;min-height:650px;border-left:1px solid var(--gray);padding:0 0 30px 35px;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(25,24,23,.05) 32px)}.typeset:before{content:"DROP WORDS HERE";position:absolute;right:10px;top:0;color:var(--gray);font:11px var(--mono);letter-spacing:.15em}.word{position:absolute;top:-70px;left:var(--x);font:500 var(--size)/1 var(--serif);color:var(--ink);cursor:grab;user-select:none;animation:fall var(--dur) cubic-bezier(.3,.8,.4,1) forwards;animation-delay:var(--delay)}.word em{color:var(--plum);font-style:normal}@keyframes fall{to{top:var(--y);transform:rotate(var(--rot))}}.legend{position:absolute;bottom:12px;left:35px;font:11px var(--mono);color:var(--gray)}@media(max-width:740px){.layout{display:block;padding:30px 18px}.tools{position:static}.typeset{margin-top:35px;min-height:570px;padding-left:18px;border-left:0}.legend{left:18px}}
</style></head><body><header class="bar"><span><strong>026</strong> / compositor's room</span><span>NEWS / EDITION 4.7</span></header><main class="layout"><aside class="tools"><h1>Gravity<br>Typesetter</h1><p>Newsprint has weight. Give each word a starting place, then let the page decide where it belongs.</p><div class="toolbox"><label for="copy">Add a phrase</label><textarea id="copy">the headline refuses to land</textarea><label for="pull">gravity pull <output id="pullOut">64</output>%</label><input id="pull" type="range" min="20" max="100" value="64"><div class="buttons"><button id="drop">DROP TYPE</button><button id="clear">CLEAR FIELD</button></div></div></aside><section class="typeset" id="field" aria-label="Gravity typesetting field"><div class="word" style="--x:12%;--y:190px;--size:42px;--rot:-3deg;--dur:1.5s;--delay:.1s">a small <em>weight</em></div><div class="word" style="--x:49%;--y:385px;--size:64px;--rot:5deg;--dur:1.9s;--delay:.3s">of air</div><div class="word" style="--x:23%;--y:530px;--size:29px;--rot:-7deg;--dur:1.3s;--delay:.5s">between editions</div><div class="legend">drag a settled word / the baseline is not a promise</div></section></main><script>(()=>{const f=document.getElementById('field'),pull=document.getElementById('pull');let i=0;document.getElementById('pull').oninput=()=>document.getElementById('pullOut').textContent=pull.value;document.getElementById('drop').onclick=()=>{let text=document.getElementById('copy').value.trim();if(!text)return;text.split(/\s+/).slice(0,9).forEach((word,j)=>{let e=document.createElement('span');e.className='word';e.textContent=word;e.style.setProperty('--x',(8+(i*17+j*9)%78)+'%');e.style.setProperty('--y',(150+(i*71+j*43)%430)+'px');e.style.setProperty('--size',(22+(j*7)%34)+'px');e.style.setProperty('--rot',(-8+(j*5)%16)+'deg');e.style.setProperty('--dur',(1.2+(100-pull.value)/80)+'s');e.style.setProperty('--delay',(j*.07)+'s');f.appendChild(e);i++;setTimeout(()=>e.style.top=e.style.getPropertyValue('--y'),(1.5+j*.08)*1000);drag(e)});};document.getElementById('clear').onclick=()=>f.querySelectorAll('.word').forEach(e=>e.remove());function drag(e){let down=false,ox=0,oy=0;e.onpointerdown=a=>{down=true;ox=a.clientX-e.offsetLeft;oy=a.clientY-e.offsetTop;e.setPointerCapture(a.pointerId);e.style.animation='none'};e.onpointermove=a=>{if(down){e.style.left=(a.clientX-ox)+'px';e.style.top=(a.clientY-oy)+'px'}};e.onpointerup=()=>down=false}f.querySelectorAll('.word').forEach(drag)})();</script></body></html>
