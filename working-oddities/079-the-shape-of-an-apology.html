<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Shape of an Apology</title><style>:root{--gray:#d8d9d6;--ink:#29343d;--blue:#467394;--gold:#d8a83e;--paper:#f1f2ed;--muted:#6d7778;--serif:Georgia,serif;--mono:ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif;overflow-x:hidden}.head{max-width:1210px;margin:auto;padding:31px 5vw 20px;border-bottom:1px solid #b8c0bd;display:flex;justify-content:space-between;gap:25px}.tag{font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}h1{font:500 clamp(2.4rem,7vw,6.5rem)/.84 var(--serif);letter-spacing:-.06em;margin:9px 0 0}.head p{max-width:290px;font-size:13px;line-height:1.55;color:var(--muted)}.main{max-width:1210px;margin:auto;padding:45px 5vw 70px;display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:clamp(25px,7vw,100px)}.choices{align-self:start}.choices h2{font:500 1.7rem var(--serif);margin:0 0 20px}.choice{border:1px solid #adb9bc;background:transparent;width:100%;text-align:left;padding:15px 17px;margin-bottom:10px;color:var(--ink);cursor:pointer;font:15px var(--serif);transition:.2s}.choice small{display:block;font:10px var(--mono);color:var(--blue);text-transform:uppercase;margin-bottom:7px}.choice:hover,.choice.active{border-color:var(--blue);background:#46739414;transform:translateX(6px)}.measure{border-top:1px solid #adb9bc;margin-top:25px;padding-top:16px;font:11px var(--mono);color:var(--muted)}.measure strong{display:block;color:var(--gold);font-size:22px;margin-top:6px}.knot-stage{position:relative;background:#e5e7e2;border:1px solid #adb9bc;min-height:590px;overflow:hidden}.knot-stage:before{content:"TOPOLOGY / REPAIR ATTEMPT";position:absolute;top:15px;left:17px;font:10px var(--mono);color:var(--blue);z-index:2}.knot-stage svg{width:100%;height:590px;display:block}.knot-path{fill:none;stroke:var(--blue);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;transition:d .7s cubic-bezier(.22,.8,.3,1)}.knot-shadow{fill:none;stroke:#29343d22;stroke-width:13;filter:blur(2px)}.gold-dot{fill:var(--gold);transition:cx .7s,cy .7s}.annotation{position:absolute;right:15px;bottom:14px;font:11px var(--mono);color:var(--muted);text-align:right}.annotation b{color:var(--gold)}@media(max-width:720px){.head{display:block;padding:24px 17px}.head p{margin-bottom:0}.main{display:block;padding:28px 17px 45px}.knot-stage{margin-top:32px;min-height:480px}.knot-stage svg{height:480px}}
</style></head><body><header class="head"><div><div class="tag">Language as material / 079</div><h1>The Shape of<br>an Apology</h1></div><p>Some sentences close a loop. Others leave enough line between two people for air to enter. Choose what can be said.</p></header><main class="main"><section class="choices"><h2>Choose the next sentence</h2><button class="choice active" data-state="begin"><small>01 / the reflex</small>“I’m sorry you feel that way.”</button><button class="choice" data-state="name"><small>02 / name the thing</small>“I interrupted you, and I knew I was doing it.”</button><button class="choice" data-state="repair"><small>03 / offer repair</small>“I want to hear the rest. I can start again.”</button><button class="choice" data-state="open"><small>04 / release</small>“You don’t have to make me comfortable.”</button><div class="measure">openness index<strong id="score">18 / 100</strong><span id="note">the line returns to itself</span></div></section><section class="knot-stage"><svg viewBox="0 0 700 590" role="img" aria-label="A knot changing shape as an apology opens"><path class="knot-shadow" id="shadow" d="M160 300 C160 120 540 120 540 300 S160 480 160 300 S540 120 540 300"/><path class="knot-path" id="knot" d="M160 300 C160 120 540 120 540 300 S160 480 160 300 S540 120 540 300"/><circle class="gold-dot" id="dot" cx="540" cy="300" r="10"/></svg><div class="annotation">current gesture<br><b id="gesture">closed loop</b></div></section></main><script>(()=>{const states={begin:{score:18,note:'the line returns to itself',gesture:'closed loop',d:'M160 300 C160 120 540 120 540 300 S160 480 160 300 S540 120 540 300',x:540,y:300},name:{score:52,note:'the knot admits a direction',gesture:'one crossing named',d:'M160 300 C160 120 540 130 510 300 S225 455 240 260 C255 105 510 160 560 340',x:560,y:340},repair:{score:78,note:'a second hand enters the pattern',gesture:'line offered back',d:'M160 300 C180 130 450 115 520 260 C585 392 280 500 230 330 C200 230 350 185 535 430',x:535,y:430},open:{score:100,note:'nothing is tied shut',gesture:'open line',d:'M145 390 C210 120 385 145 405 300 C425 455 510 470 585 170',x:585,y:170}};const knot=document.querySelector('#knot'),shadow=document.querySelector('#shadow'),dot=document.querySelector('#dot');document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active');const s=states[btn.dataset.state];knot.setAttribute('d',s.d);shadow.setAttribute('d',s.d);dot.setAttribute('cx',s.x);dot.setAttribute('cy',s.y);document.querySelector('#score').textContent=s.score+' / 100';document.querySelector('#note').textContent=s.note;document.querySelector('#gesture').textContent=s.gesture})})();</script></body></html>
