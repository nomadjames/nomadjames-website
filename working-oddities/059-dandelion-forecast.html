<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dandelion Forecast</title><style>
:root{--sky:#bfe8f1;--white:#fffefa;--green:#387b4c;--dark:#183b39;--yellow:#f1cb52}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#8dd4e6,var(--sky) 55%,#eef8ec);color:var(--dark);font:14px/1.4 ui-monospace,monospace;overflow-x:hidden}.wrap{max-width:1240px;margin:auto;padding:clamp(22px,5vw,65px)}header{display:flex;justify-content:space-between;align-items:end}.kicker{color:var(--green);letter-spacing:.2em;font-size:11px}h1{font:clamp(54px,10vw,132px)/.77 Georgia,serif;letter-spacing:-.09em;margin:15px 0 0;color:#21594e}.note{max-width:275px;color:#317260}.garden{position:relative;min-height:360px;margin-top:10px;display:flex;align-items:end;justify-content:center}.dandelion{position:relative;width:250px;height:320px}.stem{position:absolute;width:5px;height:245px;left:124px;bottom:0;background:linear-gradient(90deg,#387b4c,#6ba765);transform:rotate(5deg);transform-origin:bottom;border-radius:5px}.head{position:absolute;left:42px;top:20px;width:170px;height:170px;border-radius:50%;background:repeating-conic-gradient(#fffefa 0 4deg,#ffffff00 4deg 8deg),radial-gradient(circle,#f1cb52 0 18%,#fffefa 19% 25%,transparent 26%);filter:drop-shadow(0 4px 3px #31726044)}.seed{position:absolute;width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 0 2px #fff8;animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translate(18px,-17px)}}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:-10px}.controls button{font:inherit;padding:12px 16px;border:1px solid var(--green);background:var(--green);color:white;cursor:pointer}.controls button.secondary{background:var(--white);color:var(--green)}.meter{width:min(500px,100%);margin:14px auto 0;text-align:center;color:#387b4c;font-size:11px}.meter b{color:#21594e}.forecast{margin-top:28px;background:#ffffffc9;border:1px solid #c7e4da;padding:22px}.forecast h2{font:29px Georgia,serif;margin:0 0 16px;color:var(--green)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fafff8;border-top:4px solid var(--green);padding:12px 8px;min-height:100px}.day strong{display:block;font-size:11px}.day span{display:block;font:28px Georgia,serif;color:#21594e;margin:15px 0 5px}.day small{color:#679178;font-size:10px}@media(max-width:680px){.wrap{padding:22px 16px}.note{display:none}.garden{min-height:280px}.dandelion{transform:scale(.78);transform-origin:bottom}.forecast{padding:16px 10px;overflow:hidden}.days{grid-template-columns:repeat(7,94px);overflow:auto;padding-bottom:5px}.day{min-height:92px}}
</style></head><body><div class="wrap"><header><div><div class="kicker">BOTANICAL WEATHER DESK / 09</div><h1>Dandelion<br>forecast</h1></div><p class="note">A week of weather, grown from the gusts you give it.</p></header><section class="garden" id="garden"><div class="dandelion"><div class="head"></div><div class="stem"></div></div></section><div class="controls"><button id="gust">make a gust</button><button class="secondary" id="listen">listen for wind</button></div><div class="meter">GUSTS COLLECTED <b id="gusts">0</b> · <span id="mic">microphone sleeping</span></div><section class="forecast"><h2>This week, approximately</h2><div class="days" id="days"></div></section></div><script>
(()=>{const garden=document.querySelector('#garden'),g=document.querySelector('#gusts'),mic=document.querySelector('#mic'),days=document.querySelector('#days'),head=document.querySelector('.head');let n=0,active=false;const names=['MON','TUE','WED','THU','FRI','SAT','SUN'];function forecast(){days.innerHTML=names.map((d,i)=>{const temp=14+((n*3+i*5)%13),mood=['soft rain','bright gap','green wind','cloud notes'][((n+i)%4)];return '<div class="day"><strong>'+d+'</strong><span>'+temp+'°</span><small>'+mood+'</small></div>'}).join('')}function seed(){n++;g.textContent=n;const s=document.createElement('i');s.className='seed';s.style.left=(20+Math.random()*72)+'%';s.style.top=(10+Math.random()*40)+'%';s.style.animationDelay=(-Math.random()*4)+'s';garden.append(s);forecast()}function gust(){for(let i=0;i<3;i++)setTimeout(seed,i*100);head.animate([{transform:'rotate(0)'},{transform:'rotate(-7deg)'},{transform:'rotate(3deg)'},{transform:'rotate(0)'}],{duration:600});}document.querySelector('#gust').onclick=gust;garden.addEventListener('pointermove',e=>{if(e.buttons)gust()});document.querySelector('#listen').onclick=async()=>{if(active)return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new AudioContext(),an=ac.createAnalyser(),src=ac.createMediaStreamSource(stream);src.connect(an);const data=new Uint8Array(an.frequencyBinCount);active=true;mic.textContent='listening to your room';function hear(){an.getByteFrequencyData(data);const loud=data.reduce((a,b)=>a+b,0)/data.length;if(loud>18)gust();if(active)requestAnimationFrame(hear)}hear()}catch(e){mic.textContent='mic unavailable · pointer gusts welcome'}};forecast()})();
</script></body></html>
