<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elastic Constellations</title>
<style>:root{--indigo:#151b55;--indigo2:#28327c;--silver:#c6d0e0;--aurora:#76f1bd;--violet:#bca6ff;--white:#f4f6ff;--mono:ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 30%,#343c8d,var(--indigo) 60%);color:var(--white);font-family:system-ui,sans-serif;padding:28px 5vw;min-height:100vh}.page{max-width:1240px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #7c89c4;padding-bottom:22px}.eyebrow{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--aurora)}h1{font:500 clamp(44px,7vw,96px)/.85 Georgia,serif;margin:13px 0 0;letter-spacing:-.05em}.head p{max-width:310px;font-size:14px;line-height:1.5}.network{margin-top:26px;position:relative}.network canvas{width:100%;height:590px;display:block;border:1px solid #6472b4;background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(118,241,189,.08));touch-action:none}.hud{display:flex;gap:24px;align-items:center;margin-top:16px}.button{background:var(--aurora);border:0;color:var(--indigo);font:12px var(--mono);text-transform:uppercase;padding:12px 17px;cursor:pointer}.read{font:13px var(--mono);color:var(--silver)}.legend{margin-left:auto;font:11px var(--mono);color:var(--silver)}@media(max-width:700px){body{padding:20px 14px}.head{display:block}.head p{margin-top:20px}.network canvas{height:430px}.hud{display:block}.read,.legend{display:block;margin-top:12px}}
</style></head><body><main class="page"><header class="head"><div><div class="eyebrow">resonance study / 045</div><h1>Elastic<br>Constellations</h1></div><p>Each star is a small spring. Pluck one and the tension travels across the whole sky. Drag a node; release it to hear the network answer.</p></header><section class="network"><canvas id="sky" width="1200" height="590" aria-label="interactive spring network"></canvas><div class="hud"><button class="button" id="sound">wake the constellation</button><span class="read" id="read">0 plucks · waiting for a hand</span><span class="legend">silver = tension / aurora = struck</span></div></section></main><script>const cv=document.querySelector('#sky'),ctx=cv.getContext('2d'),read=document.querySelector('#read'),sound=document.querySelector('#sound');let nodes=[...Array(13)].map((_,i)=>({x:80+(i%5)*250+(i%2)*35,y:90+Math.floor(i/5)*190+(i%3)*25,vx:0,vy:0,r:8+((i*7)%5)})),drag=null,plucks=0,audio=null;function resize(){const r=cv.getBoundingClientRect();cv.width=1200;cv.height=590}function edges(){return nodes.flatMap((a,i)=>nodes.slice(i+1).map((b,j)=>({a,b,d:Math.hypot(a.x-b.x,a.y-b.y)})).filter(e=>e.d<310))}function draw(){ctx.clearRect(0,0,cv.width,cv.height);edges().forEach(e=>{ctx.strokeStyle=`rgba(198,208,224,${Math.max(.12,1-e.d/370)})`;ctx.lineWidth=1+(310-e.d)/100;ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke()});nodes.forEach((n,i)=>{ctx.shadowBlur=n.hit?24:8;ctx.shadowColor=n.hit?'#76f1bd':'#bca6ff';ctx.fillStyle=n.hit?'#76f1bd':'#c6d0e0';ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#151b55';ctx.font='11px ui-monospace';ctx.fillText(String(i+1).padStart(2,'0'),n.x-7,n.y+4)});nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;n.vx*=.96;n.vy*=.96;n.hit=n.hit?.94:0});requestAnimationFrame(draw)}function hit(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1200/r.width,y=(e.clientY-r.top)*590/r.height;return nodes.find(n=>Math.hypot(n.x-x,n.y-y)<28)}cv.onpointerdown=e=>{drag=hit(e);if(drag){drag.vx=0;drag.vy=0;cv.setPointerCapture(e.pointerId)}};cv.onpointermove=e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.x=(e.clientX-r.left)*1200/r.width;drag.y=(e.clientY-r.top)*590/r.height};cv.onpointerup=e=>{if(drag){drag.hit=1;plucks++;read.textContent=`${plucks} pluck${plucks===1?'':'s'} · node ${nodes.indexOf(drag)+1} returned a tone`;tone(nodes.indexOf(drag));drag=null}};function tone(i){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=180+i*29;g.gain.setValueAtTime(.18,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+1.3);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+1.3)}sound.onclick=()=>{audio=audio||new AudioContext();sound.textContent='constellation awake';read.textContent='sound online · pluck a star to listen';};draw();</script></body></html>
