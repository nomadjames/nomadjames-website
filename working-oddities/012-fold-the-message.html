<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fold the Message</title>
<style>
:root{--rice:#eee6d4;--paper:#f8f2e5;--ink:#17223b;--indigo:#263b6b;--vermilion:#c64a32;--shadow:rgba(38,59,107,.18)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#fffaf0 0,#eee6d4 42%,#d7ceb9 100%);color:var(--ink);font-family:Georgia,serif;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:24px clamp(20px,6vw,90px);font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--indigo)}.top b{color:var(--vermilion)}main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:20px}.stage{width:min(920px,100%);display:grid;grid-template-columns:260px 1fr;gap:50px;align-items:center}.instructions{font:17px/1.6 Georgia,serif}.instructions h1{font-size:clamp(37px,5vw,72px);line-height:.9;margin:0 0 22px;font-weight:400}.instructions p{margin:0 0 25px}.step{font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--vermilion)}.foldbutton{border:1px solid var(--indigo);background:transparent;color:var(--indigo);padding:11px 14px;cursor:pointer}.letter-wrap{perspective:1400px;display:grid;place-items:center}.letter{width:min(510px,86vw);aspect-ratio:1.35;background:var(--paper);position:relative;box-shadow:15px 20px 30px var(--shadow);transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1);overflow:hidden}.letter:before{content:'山  川  雲';position:absolute;top:14px;right:18px;color:#b7a88c;font-size:18px;letter-spacing:.22em}.letter .seal{position:absolute;bottom:20px;right:23px;border:2px solid var(--vermilion);color:var(--vermilion);width:44px;height:44px;display:grid;place-items:center;font-size:22px;transform:rotate(-8deg)}.crease{position:absolute;background:rgba(38,59,107,.12);z-index:2}.v{width:1px;height:100%;left:50%;top:0}.h{height:1px;width:100%;left:0;top:50%}.panel{position:absolute;inset:0;display:grid;place-items:center;padding:30px;backface-visibility:hidden}.cipher{font:clamp(29px,5vw,50px)/1.2 ui-monospace,monospace;letter-spacing:.12em;color:var(--indigo);text-align:center}.decoded{font-size:clamp(24px,4vw,42px);text-align:center;color:var(--vermilion);max-width:380px}.flap{position:absolute;inset:0;background:var(--rice);transform-origin:top;transform:rotateX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1);z-index:3;border-bottom:1px solid rgba(38,59,107,.15)}.flap:after{content:'';position:absolute;inset:25% 18%;border:1px solid rgba(38,59,107,.22);transform:rotate(45deg)}.letter.s1 .flap{transform:rotateX(72deg)}.letter.s2 .flap{transform:rotateX(90deg)}.letter.s2{transform:rotateY(-7deg) rotateX(3deg)}.letter.s3{transform:rotateY(0) rotateX(0)}.letter.s3 .flap{transform:rotateX(90deg)}.cipher span{display:inline-block;transition:transform .5s,opacity .5s}.s2 .cipher span{transform:translateY(-80px) rotate(90deg);opacity:0}.caption{margin-top:16px;text-align:center;font:11px ui-monospace,monospace;color:#68718a}
figure{margin:0}@media(max-width:720px){.stage{grid-template-columns:1fr;gap:28px;max-width:520px}.instructions{text-align:center}.instructions h1{font-size:48px}.letter{width:100%}.top{padding:20px}}
</style></head><body><header class="top"><span>Correspondence / 04—17</span><b id="count">fold 01</b></header><main><div class="stage"><section class="instructions"><div class="step" id="step">Step one / crease</div><h1>Fold the<br>message.</h1><p id="copy">A note can keep its meaning while changing its shape. Click once for the outside, twice for the inside, then read what was hidden.</p><button class="foldbutton" id="fold">Make the first crease</button></section><figure><div class="letter-wrap"><div class="letter s0" id="letter"><div class="panel"><div class="cipher"><span>Q</span><span>V</span><span>J</span><span>H</span><span>R</span><span>·</span><span>F</span><span>Y</span><span>T</span></div></div><div class="panel"><div class="decoded">meet me where<br>the river turns</div></div><div class="flap"></div><i class="crease v"></i><i class="crease h"></i><div class="seal">印</div></div></div><figcaption class="caption">paper cipher / click sequence is the key</figcaption></figure></div></main><script>(()=>{let n=0,states=[['Step one / crease','Make the first crease','The cover catches the daylight. One more fold will make the glyphs legible.'],['Step two / turn','Turn the paper over','The cipher is only a decoy. The fold is the key, not the alphabet.'],['Message recovered / open','Start again','The note says: meet me where the river turns. The paper remembers your hands.']];const l=document.querySelector('#letter'),b=document.querySelector('#fold');b.onclick=()=>{n=(n+1)%3;l.className='letter s'+(n+1);let x=states[n];document.querySelector('#step').textContent=x[0];b.textContent=x[1];document.querySelector('#copy').textContent=x[2];document.querySelector('#count').textContent='fold '+String(n+1).padStart(2,'0')};document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();b.click()}})})();</script></body></html>
