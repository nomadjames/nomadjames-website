<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tectonic Sandwich</title><style>
:root{--rye:#2a1d17;--bread:#b88755;--mustard:#eabf32;--pickle:#91ad3e;--red:#d84b37;--cream:#f4e7c6}*{box-sizing:border-box}body{margin:0;background:var(--rye);color:var(--cream);font:14px/1.4 ui-monospace,monospace;overflow-x:hidden}.wrap{max-width:1280px;margin:auto;padding:clamp(20px,5vw,70px)}header{display:grid;grid-template-columns:1fr 310px;gap:30px;align-items:end}.kicker{color:var(--mustard);letter-spacing:.18em;font-size:11px}h1{font:clamp(50px,9vw,124px)/.78 Georgia,serif;letter-spacing:-.085em;margin:15px 0 0;color:#fff0c9}.lede{border-left:3px solid var(--red);padding-left:17px;color:#dfcda7}.console{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;margin-top:38px}.pan{position:relative;height:min(60vh,590px);min-height:370px;background:#433027;border:1px solid #a66d3b;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 50px #160c08}.pan:before{content:"STRATA / 04";position:absolute;z-index:4;top:14px;left:16px;color:#f9da62;font-size:11px}.pan canvas{width:100%;height:100%;display:block}.rail{border:1px solid #6b4633;padding:21px;background:#211510;border-radius:14px}.rail h2{font:24px Georgia,serif;margin:0 0 20px;color:var(--mustard)}label{display:block;color:#c9ae88;font-size:11px;letter-spacing:.1em;margin:18px 0 7px}input[type=range]{width:100%;accent-color:var(--mustard)}button{background:var(--mustard);border:0;color:#241510;padding:11px 14px;font:inherit;cursor:pointer;border-radius:3px;margin-top:15px}button.secondary{background:transparent;color:var(--cream);border:1px solid #8d6043}.readout{border-top:1px solid #6b4633;margin-top:22px;padding-top:17px;color:#b99672;font-size:12px}.readout b{color:#f7df8c}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.legend span{border-radius:20px;padding:5px 8px;font-size:10px}.r{background:var(--bread);color:var(--rye)}.m{background:var(--mustard);color:var(--rye)}.p{background:var(--pickle);color:var(--rye)}.c{background:var(--red);color:white}@media(max-width:760px){.wrap{padding:24px 17px}header,.console{grid-template-columns:1fr}.lede{margin-top:10px}.rail{order:-1}.pan{height:53vh;min-height:330px}}
</style></head><body><div class="wrap"><header><div><div class="kicker">A LUNCH-SIZED GEOLOGY LAB</div><h1>Tectonic<br>sandwich</h1></div><p class="lede">Every lunch has a fault line. Move the plates, watch the mustard shear, count the crumbs that remember the impact.</p></header><div class="console"><div class="pan"><canvas id="sand" aria-label="Animated layered sandwich simulation"></canvas></div><aside class="rail"><h2>Field controls</h2><label for="drift">PLATE DRIFT <span id="driftVal">0.8</span></label><input id="drift" type="range" min="0" max="2" step=".1" value=".8"><label for="heat">MUSTARD PRESSURE <span id="heatVal">62%</span></label><input id="heat" type="range" min="20" max="100" value="62"><button id="pause">pause drift</button><button class="secondary" id="crumb">drop a crumb</button><div class="readout">COLLISIONS <b id="hits">0</b><br>PLATE STATUS <b id="status">sliding east</b></div><div class="legend"><span class="r">RYE</span><span class="m">MUSTARD</span><span class="p">PICKLE</span><span class="c">IMPACT</span></div></aside></div></div><script>
(()=>{const c=document.querySelector('#sand'),ctx=c.getContext('2d'),drift=document.querySelector('#drift'),heat=document.querySelector('#heat'),dv=document.querySelector('#driftVal'),hv=document.querySelector('#heatVal'),hits=document.querySelector('#hits'),stat=document.querySelector('#status'),pause=document.querySelector('#pause');let W,H,t=0,run=true,n=0,crumbs=[];function size(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0)}function add(x=Math.random()*W,y=H*.45+Math.random()*H*.18){crumbs.push({x,y,vx:(Math.random()-.5)*2,vy:-(Math.random()*2+1),life:1,s:2+Math.random()*4})}for(let i=0;i<13;i++)add();function draw(){if(run)t+=.016*+drift.value;ctx.clearRect(0,0,W,H);ctx.fillStyle='#302019';ctx.fillRect(0,0,W,H);const layers=[['#a77a4e',.17,44],['#deaa67',.30,54],['#6f8b32',.44,27],['#e5b929',.51,20],['#c84634',.60,13],['#a77a4e',.73,55]];layers.forEach(([col,y,h],i)=>{let off=Math.sin(t*(i%2?-.65:.8)+i)*18;ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-30+off,H*y,W+60,h,12);ctx.fill();ctx.strokeStyle= i===2?'#c7e47a':'#180e0a55';ctx.lineWidth=1;ctx.stroke();ctx.save();ctx.beginPath();ctx.roundRect(-30+off,H*y,W+60,h,12);ctx.clip();ctx.strokeStyle=i===2?'#d5ed8144':'#32190f55';ctx.lineWidth=1;for(let cell=-1;cell<18;cell++){let cx=cell*72+off+Math.sin(t*.7+cell+i)*8;ctx.beginPath();ctx.moveTo(cx,H*y);ctx.lineTo(cx+18,H*(y+1)*1);ctx.stroke()}ctx.restore()});ctx.fillStyle='#dfc06d';for(let i=0;i<18;i++){let x=(i*71+t*18)%W;ctx.fillRect(x,H*.34+(i%3)*5,20+(i%4)*6,2)}ctx.fillStyle='#f1d573';for(let i=0;i<7;i++){let x=(i*91+t*10)%W,y=H*.53+(i%2)*6;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()}if(run&&Math.random()<.09)add();crumbs.forEach(q=>{if(run){q.x+=q.vx;q.y+=q.vy;q.vy+=.035;q.life-=.006}ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle='#e9cf98';ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,7);ctx.fill();ctx.globalAlpha=1;if(q.y>H*.63&&q.life>.2){n++;q.life=0}});crumbs=crumbs.filter(q=>q.life>0);hits.textContent=n;stat.textContent=run?(+drift.value>1.3?'rapid convergence':+drift.value<.4?'nearly still':'sliding east'):'plates paused';requestAnimationFrame(draw)}drift.oninput=()=>dv.textContent=drift.value;heat.oninput=()=>{hv.textContent=heat.value+'%';document.documentElement.style.setProperty('--mustard','#'+(Math.round(150+heat.value*.9)).toString(16)+'b52f')};pause.onclick=()=>{run=!run;pause.textContent=run?'pause drift':'resume drift'};document.querySelector('#crumb').onclick=()=>add(W*.45,H*.42);c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();add(e.clientX-r.left,e.clientY-r.top)});addEventListener('resize',size);size();draw()})();
</script></body></html>
