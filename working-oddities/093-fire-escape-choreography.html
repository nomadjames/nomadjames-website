<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire Escape Choreography</title><style>
:root{--brick:#934d3d;--brick2:#b6654e;--iron:#191d20;--turq:#54d1c4;--chalk:#ead7c2}*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{background:var(--brick);color:var(--chalk);font-family:system-ui,sans-serif}.frame{max-width:1450px;margin:auto;padding:28px 40px 40px}.head{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:end}.eyebrow{font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--turq)}h1{font:clamp(3.2rem,8.5vw,9rem)/.8 Georgia,serif;font-weight:400;margin:12px 0 0;letter-spacing:-.08em}.head p{font-size:14px;line-height:1.5;border-left:2px solid var(--turq);padding-left:18px}.scene{margin-top:28px;border:12px solid var(--iron);background:repeating-linear-gradient(0deg,transparent 0 62px,#713b32 63px 65px),repeating-linear-gradient(90deg,transparent 0 110px,#713b32 111px 114px);position:relative;min-height:650px;overflow:hidden}.windows{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:absolute;inset:35px 6% 90px}.window{border:7px solid var(--iron);background:#292b2c;position:relative;min-height:150px}.window:before{content:"";position:absolute;inset:15px;border:2px solid #51595a;background:linear-gradient(140deg,#373535,#16191b)}.window .floor{position:absolute;bottom:18px;left:10px;right:10px;height:3px;background:var(--iron)}.escape{position:absolute;left:0;right:0;bottom:41px;height:22px;background:var(--iron);border-top:3px solid var(--turq)}.escape:before,.escape:after{content:"";position:absolute;top:-340px;width:14px;height:362px;background:var(--iron);box-shadow:0 0 0 2px #31383a}.escape:before{left:13%}.escape:after{right:13%}.rail{position:absolute;left:13%;right:13%;top:-325px;height:13px;border:4px solid var(--iron);border-bottom:0}.exit{position:absolute;right:2%;bottom:12px;color:var(--turq);font:700 11px ui-monospace,monospace;letter-spacing:.1em}.dancer{position:absolute;width:22px;height:52px;z-index:3;transition:left 1s cubic-bezier(.2,.8,.3,1),bottom 1s cubic-bezier(.2,.8,.3,1);filter:drop-shadow(4px 4px 0 #15191b)}.dancer:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--turq);left:3px}.dancer:after{content:"";position:absolute;left:8px;top:13px;width:7px;height:34px;background:var(--chalk);box-shadow:-14px 18px 0 -2px var(--chalk),17px 18px 0 -2px var(--chalk);transform:rotate(-10deg);transform-origin:top}.d1{left:20%;bottom:72px}.d2{left:36%;bottom:72px}.d3{left:52%;bottom:72px}.d4{left:68%;bottom:72px}.dancer.go{animation:step .9s ease-in-out infinite alternate}.controls{display:flex;align-items:center;gap:15px;margin-top:18px;flex-wrap:wrap}.controls button{background:var(--turq);border:0;padding:12px 17px;color:#142d2d;font-weight:800}.controls button.alt{background:var(--iron);color:var(--chalk)}.status{font:12px ui-monospace,monospace;color:#ffddd0}@keyframes step{to{transform:translateY(-9px) rotate(4deg)}}@media(max-width:760px){.frame{padding:22px 16px 28px}.head{display:block}.head p{margin-top:20px}.scene{min-height:540px;border-width:8px}.windows{inset:25px 0 95px;grid-template-columns:repeat(3,1fr)}.window{border-width:4px;min-height:120px}.window:nth-child(n+4){margin-top:45px}.escape:before,.escape:after{top:-280px;height:302px}.rail{top:-265px}.dancer{transform:scale(.8)}.d1{left:12%}.d2{left:32%}.d3{left:54%}.d4{left:74%}}
</style></head><body><main class="frame"><header class="head"><div><div class="eyebrow">façade study 093 / exit as ensemble</div><h1>Fire-escape choreography</h1></div><p>Four neighbors, one iron stage. Click a window to give a dancer a route; sequence the whole building when the night needs a clean exit.</p></header><section class="scene" id="scene"><div class="windows"><div class="window" data-route="1"><span class="floor"></span></div><div class="window" data-route="2"><span class="floor"></span></div><div class="window" data-route="3"><span class="floor"></span></div><div class="window" data-route="4"><span class="floor"></span></div><div class="window" data-route="5"><span class="floor"></span></div><div class="window" data-route="6"><span class="floor"></span></div></div><div class="rail"></div><div class="escape"></div><div class="dancer d1" data-i="0"></div><div class="dancer d2" data-i="1"></div><div class="dancer d3" data-i="2"></div><div class="dancer d4" data-i="3"></div><div class="exit">EXIT / GROUND LEVEL</div></section><div class="controls"><button id="sequence">Run the sequence</button><button id="reset" class="alt">Return dancers</button><span class="status" id="status" aria-live="polite">Cue 01 — choose a window.</span></div></main><script>
(()=>{const ds=[...document.querySelectorAll('.dancer')],ws=[...document.querySelectorAll('.window')],status=document.querySelector('#status');let step=0;function move(i,route){const d=ds[i%ds.length],w=ws[route-1],r=w.getBoundingClientRect(),s=document.querySelector('#scene').getBoundingClientRect();d.style.left=((r.left-s.left+r.width/2)/s.width*100)+'%';d.style.bottom=(s.bottom-r.bottom+22)+'px';d.classList.add('go');status.textContent='Dancer '+String(i+1).padStart(2,'0')+' takes window '+route+'.'}ws.forEach((w,i)=>w.addEventListener('click',()=>move(step++,i+1)));document.querySelector('#sequence').addEventListener('click',()=>{step=0;ws.forEach((_,i)=>setTimeout(()=>move(i,i+1),i*450))});document.querySelector('#reset').addEventListener('click',()=>{ds.forEach((d,i)=>{d.className='dancer d'+(i+1);d.style.left=['20%','36%','52%','68%'][i];d.style.bottom='72px'});step=0;status.textContent='Cue 01 — choose a window.'})})();</script></body></html>
