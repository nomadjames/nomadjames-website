<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Sail Regatta</title><style>
:root{--vac:#071728;--blue:#0d3557;--white:#f5f7f0;--gold:#f1c75b;--ice:#85cbe0}*{box-sizing:border-box}body{margin:0;background:var(--vac);color:var(--white);font:14px/1.4 ui-monospace,monospace;overflow-x:hidden}.wrap{max-width:1260px;margin:auto;padding:clamp(22px,5vw,68px)}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #275170;padding-bottom:18px}.eyebrow{font-size:11px;color:var(--gold);letter-spacing:.18em}h1{font:clamp(48px,8vw,110px)/.8 Georgia,serif;letter-spacing:-.08em;margin:15px 0 0}.note{color:#a2c7d7;max-width:290px}.regatta{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:25px;margin-top:29px}.sky{background:linear-gradient(#0a2038,#06111f);border:1px solid #2a5a7e;min-height:590px;position:relative;overflow:hidden}.sky svg{width:100%;height:100%;min-height:590px;display:block}.orbits{fill:none;stroke:#3d7a9a;stroke-dasharray:2 7;opacity:.55}.boat{transition:transform .2s}.controls{border:1px solid #2a5a7e;padding:20px;background:#0b2136}.controls h2{font:26px Georgia,serif;color:var(--gold);margin:0 0 18px}label{display:flex;justify-content:space-between;margin:17px 0 7px;color:#abd1df;font-size:11px}input{width:100%;accent-color:var(--gold)}button{font:inherit;border:1px solid var(--gold);background:var(--gold);color:var(--vac);padding:11px 14px;cursor:pointer;margin-top:16px}button.secondary{background:transparent;color:var(--white);border-color:#4f8197;margin-left:4px}.rank{border-top:1px solid #315b72;padding-top:17px;margin-top:22px;color:#92bacb;font-size:12px}.rank b{color:var(--gold)}.legend{margin-top:22px;display:grid;gap:7px;color:#9ac7d5;font-size:11px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.a{background:#f1c75b}.b{background:#f5f7f0}.c{background:#85cbe0}@media(max-width:720px){.wrap{padding:23px 17px}.note{display:none}.regatta{grid-template-columns:1fr}.sky,.sky svg{min-height:430px;height:58vh}.controls{order:-1}.controls h2{font-size:22px}}
</style></head><body><div class="wrap"><header><div><div class="eyebrow">KEPLER CUP / TRIAL 11</div><h1>Solar sail<br>regatta</h1></div><p class="note">Three patient vessels. One star. Angle the sail; the vacuum will do the rest.</p></header><main class="regatta"><section class="sky" aria-label="Solar sail race visualization"><svg viewBox="0 0 760 590" role="img"><defs><radialGradient id="star"><stop stop-color="#fff8cf"/><stop offset="1" stop-color="#f1c75b00"/></radialGradient></defs><rect width="760" height="590" fill="#071728"/><circle cx="380" cy="295" r="120" fill="url(#star)" opacity=".2"/><circle cx="380" cy="295" r="30" fill="#f1c75b"/><circle cx="380" cy="295" r="21" fill="#fff5bf"/><g class="orbits"><ellipse cx="380" cy="295" rx="145" ry="88"/><ellipse cx="380" cy="295" rx="240" ry="150"/><ellipse cx="380" cy="295" rx="334" ry="220"/></g><g id="boats"><g class="boat" id="boatA"><path d="M0 0l23 8-23 8 6-8z" fill="#f1c75b"/><path d="M6 8l-24-23 26 17z" fill="#f1c75b" opacity=".8"/><text x="28" y="5" fill="#f1c75b" font-size="11">AURORA</text></g><g class="boat" id="boatB"><path d="M0 0l23 8-23 8 6-8z" fill="#f5f7f0"/><path d="M6 8l-24-23 26 17z" fill="#f5f7f0" opacity=".8"/><text x="28" y="5" fill="#f5f7f0" font-size="11">LAG</text></g><g class="boat" id="boatC"><path d="M0 0l23 8-23 8 6-8z" fill="#85cbe0"/><path d="M6 8l-24-23 26 17z" fill="#85cbe0" opacity=".8"/><text x="28" y="5" fill="#85cbe0" font-size="11">PEREGRINE</text></g></g><text x="22" y="565" fill="#75a9be" font-size="11">ORBITAL FIELD / LIVE SIMULATION</text></svg></section><aside class="controls"><h2>Trim the sails</h2><label>AURORA <span id="av">42°</span></label><input id="a" type="range" min="0" max="90" value="42"><label>LAG <span id="bv">63°</span></label><input id="b" type="range" min="0" max="90" value="63"><label>PEREGRINE <span id="cv">21°</span></label><input id="c" type="range" min="0" max="90" value="21"><button id="go">start race</button><button class="secondary" id="reset">rewind</button><div class="rank">ELAPSED <b id="time">00.0</b>s<br>LEADER <b id="leader">—</b></div><div class="legend"><span><i class="a"></i>AURORA · gold</span><span><i class="b"></i>LAG · white</span><span><i class="c"></i>PEREGRINE · ice</span></div></aside></main></div><script>
(()=>{const ids=['a','b','c'],names=['AURORA','LAG','PEREGRINE'],boats=ids.map(x=>document.querySelector('#boat'+x.toUpperCase())),out=ids.map(x=>document.querySelector('#'+x+'v'));let running=false,t=0,last=0;ids.forEach((id,i)=>document.querySelector('#'+id).oninput=e=>out[i].textContent=e.target.value+'°');function frame(ms){if(!last)last=ms;const dt=(ms-last)/1000;last=ms;if(running)t=Math.min(99,t+dt);const scores=ids.map((id,i)=>{const ang=+document.querySelector('#'+id).value;const speed=.55+Math.sin(ang*Math.PI/180)*.4;const phase=t*speed+i*2.2;const rr=70+i*80, x=380+Math.cos(phase)*rr, y=295+Math.sin(phase)*rr*.63;boats[i].setAttribute('transform','translate('+x+' '+y+') rotate('+(phase*57+ang)+')');return speed});document.querySelector('#time').textContent=t.toFixed(1).padStart(4,'0');document.querySelector('#leader').textContent=names[scores.indexOf(Math.max(...scores))];requestAnimationFrame(frame)}document.querySelector('#go').onclick=()=>{running=!running;document.querySelector('#go').textContent=running?'pause race':'resume race'};document.querySelector('#reset').onclick=()=>{t=0;running=false;document.querySelector('#go').textContent='start race'};addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();document.querySelector('#go').click()}if(e.key.toLowerCase()==='r')document.querySelector('#reset').click()});requestAnimationFrame(frame)})();
</script></body></html>
