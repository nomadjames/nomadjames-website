<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sundown Memory Game</title><style>
:root{--apricot:#ffad76;--peach:#ffd8ae;--plum:#3b1e46;--plum2:#5d2d5f;--gold:#f7d35d}*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{background:var(--apricot);color:var(--plum);font-family:system-ui,sans-serif}.wrap{max-width:1220px;margin:auto;padding:28px 36px 42px}.header{display:flex;justify-content:space-between;gap:24px;align-items:end}.tag{font:11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.header h1{font:clamp(3.2rem,9vw,9rem)/.78 Georgia,serif;font-weight:400;letter-spacing:-.08em;margin:12px 0 0}.header p{max-width:260px;font-size:13px;line-height:1.5}.game{display:grid;grid-template-columns:1fr 250px;gap:25px;margin-top:28px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:0;background:var(--peach);aspect-ratio:1/1.15;min-height:160px;position:relative;perspective:600px;cursor:pointer;color:var(--plum)}.card:before{content:"";position:absolute;inset:10px;border:1px solid var(--plum2);opacity:.4}.card .face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;transition:transform .35s,filter .5s}.card .back{background:var(--plum);color:var(--gold);font:26px Georgia,serif}.card .front{transform:rotateY(180deg);font-size:52px}.card.revealed .back,.card.matched .back{transform:rotateY(180deg)}.card.revealed .front,.card.matched .front{transform:rotateY(0)}.card.matched{outline:4px solid var(--gold);outline-offset:4px}.sil{position:relative;width:55px;height:75px;background:var(--plum);border-radius:48% 48% 10% 10%}.sil:before{content:"";position:absolute;width:30px;height:30px;background:var(--plum);border-radius:50%;top:-22px;left:12px}.sil:after{content:"";position:absolute;bottom:0;left:-18px;width:90px;height:8px;background:var(--plum);border-radius:50%}.cat .sil{transform:skew(-10deg);}.boat .sil{height:35px;border-radius:0 0 50% 50%;margin-top:30px}.boat .sil:before{width:6px;height:65px;border-radius:0;left:26px;top:-59px}.moon .sil{width:60px;height:60px;border-radius:50%;box-shadow:17px -4px 0 var(--peach)}.pine .sil{width:0;height:0;background:none;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:75px solid var(--plum);border-radius:0}.info{background:var(--plum);color:var(--peach);padding:21px;align-self:start}.info h2{font:30px Georgia,serif;font-weight:400;margin:0 0 12px}.info p{color:#f3c0a2;font-size:13px;line-height:1.45}.readout{font:700 34px ui-monospace,monospace;color:var(--gold);margin:22px 0 5px}.bar{height:8px;background:#7a456f;margin:8px 0 20px}.bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width .2s linear}.info button{width:100%;padding:11px;background:var(--gold);border:0;color:var(--plum);font-weight:800;margin-top:7px}.hint{font:11px ui-monospace,monospace;line-height:1.5;color:#e7a58e}@media(max-width:760px){.wrap{padding:22px 15px 30px}.header{display:block}.header p{max-width:none;margin-top:18px}.game{display:flex;flex-direction:column}.cards{grid-template-columns:repeat(4,1fr);gap:7px}.card{min-height:88px}.card .front{font-size:31px}.card:before{inset:5px}.sil{transform:scale(.58)}.info{padding:18px}}
</style></head><body><main class="wrap"><header class="header"><div><div class="tag">twilight study 094 / visual memory</div><h1>Sundown memory</h1></div><p>Match each silhouette before the apricot light leaves. Every second makes the cards quieter.</p></header><section class="game"><div class="cards" id="cards"></div><aside class="info"><div class="tag">last light</div><h2>Hold the shape.</h2><p id="message" aria-live="polite">Find the two moons.</p><div class="readout" id="time">30</div><div class="hint">seconds remaining</div><div class="bar"><i id="bar"></i></div><button id="again">New dusk</button><button id="pause">Pause contrast</button></aside></section></main><script>
(()=>{const defs=[['moon','Moon'],['boat','Boat'],['cat','Cat'],['pine','Pine'],['moon','Moon'],['boat','Boat'],['cat','Cat'],['pine','Pine']],cards=document.querySelector('#cards');let first=null,lock=false,matched=0,left=30,paused=false,interval;function shuffle(a){return a.sort(()=>Math.random()-.5)}function build(){cards.innerHTML='';shuffle([...defs]).forEach(([kind,name],i)=>{let b=document.createElement('button');b.className='card';b.dataset.kind=kind;b.setAttribute('aria-label','Hidden silhouette '+(i+1));b.innerHTML='<span class="face back">✦</span><span class="face front"><i class="'+kind+'"><b class="sil"></b></i></span>';b.addEventListener('click',()=>flip(b));cards.appendChild(b)});first=null;lock=false;matched=0;left=30;paused=false;document.querySelector('#message').textContent='Find the two moons.';document.querySelector('#pause').textContent='Pause contrast'}function flip(c){if(lock||paused||c.classList.contains('revealed')||c.classList.contains('matched'))return;c.classList.add('revealed');if(!first){first=c;return}if(first.dataset.kind===c.dataset.kind){first.classList.add('matched');c.classList.add('matched');matched+=2;first=null;document.querySelector('#message').textContent=matched===8?'All shapes held.':'A pair survives the dusk.';if(matched===8)clearInterval(interval)}else{lock=true;document.querySelector('#message').textContent='Not twins. Let the light settle.';setTimeout(()=>{first.classList.remove('revealed');c.classList.remove('revealed');first=null;lock=false},700)}}function tick(){if(paused||matched===8)return;left--;document.querySelector('#time').textContent=left;document.querySelector('#bar').style.width=(left/30*100)+'%';cards.style.filter='contrast('+(0.42+left/30*.58)+') saturate('+(0.55+left/30*.45)+')';if(left<=0){clearInterval(interval);lock=true;document.querySelector('#message').textContent='The silhouettes have gone violet. Start another dusk.'}}document.querySelector('#again').addEventListener('click',()=>{clearInterval(interval);build();interval=setInterval(tick,1000)});document.querySelector('#pause').addEventListener('click',()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume contrast':'Pause contrast'});build();interval=setInterval(tick,1000)})();</script></body></html>
