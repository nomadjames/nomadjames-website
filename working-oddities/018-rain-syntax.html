<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rain Syntax</title>
<style>
:root{--gray:#a8afb3;--dark:#252a2d;--sodium:#f0a83a;--cyan:#8fe9ee;--white:#eef2ed}*{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--white);font:15px/1.5 system-ui,sans-serif;overflow:hidden}.head{height:76px;border-bottom:1px solid #4a5358;padding:0 5vw;display:flex;align-items:center;justify-content:space-between}.head h1{font:400 30px/1 Georgia,serif;margin:0}.head span{font:11px ui-monospace,monospace;color:var(--sodium);letter-spacing:.13em;text-transform:uppercase}.layout{height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(280px,390px) 1fr}.editor{padding:48px 5vw;border-right:1px solid #4a5358;display:flex;flex-direction:column}.editor h2{font:400 clamp(33px,5vw,65px)/.9 Georgia,serif;margin:0 0 22px}.editor p{color:var(--gray);max-width:300px}.editor textarea{margin-top:30px;width:100%;min-height:180px;resize:vertical;background:#1b1f22;color:var(--white);border:1px solid #596268;padding:15px;font:18px/1.6 ui-monospace,monospace;outline-color:var(--cyan)}.legend{margin-top:auto;display:grid;gap:8px;font:11px ui-monospace,monospace;color:var(--gray)}.legend b{color:var(--sodium);font-weight:400}.sky{position:relative;min-width:0}.sky canvas{position:absolute;inset:0;width:100%;height:100%}.sky-label{position:absolute;top:32px;right:38px;color:#69777e;font:11px ui-monospace,monospace;letter-spacing:.12em}.hint{position:absolute;bottom:28px;left:35px;color:#677278;font:11px ui-monospace,monospace}
@media(max-width:720px){body{overflow:auto}.layout{height:auto;min-height:calc(100vh - 76px);grid-template-columns:1fr}.editor{border-right:0;padding:34px 20px}.editor textarea{min-height:130px}.sky{height:52vh;min-height:300px}.sky-label{top:18px;right:20px}.hint{bottom:15px;left:20px}.head{padding:0 20px}}
</style></head><body><header class="head"><h1>Rain Syntax</h1><span id="count">00 marks in weather</span></header><div class="layout"><section class="editor"><h2>Punctuation<br>is weather.</h2><p>Type a sentence. Commas mist, periods fall heavy, semicolons arc, and question marks flash cyan.</p><textarea id="text" aria-label="Syntax input">The train waited; then, without warning, it left.</textarea><div class="legend"><div><b>comma</b> / mist</div><div><b>period</b> / drop</div><div><b>semicolon</b> / arc</div><div><b>question</b> / flash</div></div></section><section class="sky"><canvas id="rain"></canvas><div class="sky-label">LIVE PRECIPITATION / PARSER 1.8</div><div class="hint">edit the sentence to change the forecast</div></section></div><script>(()=>{const c=document.querySelector('#rain'),ctx=c.getContext('2d'),ta=document.querySelector('#text'),count=document.querySelector('#count');let W,H,parts=[],last='';function size(){W=c.width=c.clientWidth*devicePixelRatio;H=c.height=c.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=c.clientWidth;H=c.clientHeight}window.onresize=size;function parse(){let t=ta.value;if(t===last)return;last=t;parts=[];[...t].forEach((ch,i)=>{if('.,;?!:'.includes(ch))parts.push({x:30+Math.random()*(W-60),y:-20-Math.random()*H,v:1+Math.random()*2,type:ch,phase:Math.random()*7})});count.textContent=String(parts.length).padStart(2,'0')+' marks in weather'}function draw(){parse();ctx.fillStyle='rgba(37,42,45,.23)';ctx.fillRect(0,0,W,H);parts.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/45+p.phase)*.35;if(p.y>H+30){p.y=-20;p.x=30+Math.random()*(W-60)}ctx.save();ctx.translate(p.x,p.y);if(p.type===';'){ctx.strokeStyle='#f0a83a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,15,Math.PI*1.15,Math.PI*1.9);ctx.stroke()}else if(p.type==='?'){ctx.fillStyle='#8fe9ee';ctx.shadowBlur=20;ctx.shadowColor='#8fe9ee';ctx.font='24px Georgia';ctx.fillText('?',0,0)}else{ctx.fillStyle=p.type===','?'#a8afb3':p.type==='.'?'#f0a83a':'#8fe9ee';ctx.beginPath();ctx.ellipse(0,0,p.type===','?2:4,p.type===','?8:13,0,0,Math.PI*2);ctx.fill()}ctx.restore()});requestAnimationFrame(draw)}size();draw();setInterval(()=>{parts.forEach(p=>p.v*=.98)},3000)})();</script></body></html>
