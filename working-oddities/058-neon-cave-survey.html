<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Cave Survey</title><style>
:root{--black:#070809;--green:#c8ff37;--violet:#9c5cff;--gray:#8b9681}*{box-sizing:border-box}body{margin:0;background:var(--black);color:#e9f0df;font:13px/1.4 ui-monospace,monospace;overflow-x:hidden}.wrap{max-width:1280px;margin:auto;padding:clamp(21px,5vw,64px)}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #314226;padding-bottom:18px}.kicker{color:var(--green);letter-spacing:.2em;font-size:11px}h1{font:clamp(48px,9vw,118px)/.78 Georgia,serif;letter-spacing:-.09em;margin:14px 0 0}.info{max-width:280px;color:#9ba891}.survey{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:24px;margin-top:30px}.cave{position:relative;border:1px solid #385223;background:#090c0b;min-height:590px}.cave canvas{width:100%;height:100%;min-height:590px;display:block}.cave:after{content:'RAY-CAST / VISIBILITY FIELD';position:absolute;left:16px;bottom:15px;color:#67795b;font-size:10px}.panel{border:1px solid #385223;padding:19px;background:#11170f}.panel h2{font:25px Georgia,serif;color:var(--green);margin:0 0 13px}.panel p{color:#a3b095}.stat{border-top:1px solid #385223;margin-top:22px;padding-top:15px;color:#809273;font-size:11px}.stat b{color:var(--violet)}button{display:block;width:100%;border:1px solid var(--green);color:var(--black);background:var(--green);padding:11px 14px;font:inherit;cursor:pointer;margin-top:18px}button.alt{background:transparent;color:var(--green)}.legend{display:grid;gap:8px;margin-top:22px;color:#a8b59b;font-size:11px}.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:6px}.dot.v{background:var(--violet)}@media(max-width:730px){.wrap{padding:22px 16px}.info{display:none}.survey{grid-template-columns:1fr}.panel{order:-1}.cave,.cave canvas{min-height:440px;height:58vh}}
</style></head><body><div class="wrap"><header><div><div class="kicker">SUBTERRANEAN CARTOGRAPHY / 08</div><h1>Neon cave<br>survey</h1></div><p class="info">A flashlight is a polygon. Place beacons where the dark changes shape.</p></header><main class="survey"><section class="cave"><canvas id="cave" aria-label="Cave visibility ray-casting map"></canvas></section><aside class="panel"><h2>Field kit</h2><p>Click inside the cave to leave a chartreuse beacon. The visible floor is recalculated from its rays.</p><div class="stat">BEACONS <b id="beacons">0</b><br>VISIBLE AREA <b id="area">—</b></div><button id="place">place at center</button><button class="alt" id="clear">remove beacons</button><div class="legend"><span><i class="dot"></i>beacon / light source</span><span><i class="dot v"></i>violet survey rays</span></div></aside></main></div><script>
(()=>{const c=document.querySelector('#cave'),x=c.getContext('2d'),count=document.querySelector('#beacons'),area=document.querySelector('#area');let W,H,beacons=[];const walls=[[[.04,.12],[.22,.04]],[[.22,.04],[.47,.14]],[[.47,.14],[.72,.05]],[[.72,.05],[.96,.22]],[[.96,.22],[.88,.44]],[[.88,.44],[.98,.74]],[[.98,.74],[.72,.96]],[[.72,.96],[.44,.87]],[[.44,.87],[.19,.98]],[[.19,.98],[.03,.76]],[[.03,.76],[.13,.54]],[[.13,.54],[.04,.12]],[[.23,.34],[.42,.27]],[[.42,.27],[.56,.38]],[[.56,.38],[.47,.59]],[[.47,.59],[.27,.62]],[[.27,.62],[.23,.34]]];function size(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);draw()}function draw(){x.fillStyle='#080b0a';x.fillRect(0,0,W,H);const poly=walls.map(w=>w.map(p=>[p[0]*W,p[1]*H]));x.strokeStyle='#687857';x.lineWidth=2;poly.forEach(w=>{x.beginPath();x.moveTo(...w[0]);w.slice(1).forEach(p=>x.lineTo(...p));x.closePath();x.stroke()});beacons.forEach((b,i)=>{const pts=[];for(let a=0;a<360;a+=4){const ang=a*Math.PI/180;let far=1e4;poly.forEach(w=>{for(let j=0;j<w.length-1;j++){const [x1,y1]=w[j],[x2,y2]=w[j+1];const dx=Math.cos(ang),dy=Math.sin(ang),ex=x2-x1,ey=y2-y1,den=dx*ey-dy*ex;if(Math.abs(den)<.0001)continue;const t=((x1-b.x)*ey-(y1-b.y)*ex)/den,u=((x1-b.x)*dy-(y1-b.y)*dx)/den;if(t>0&&u>=0&&u<=1)far=Math.min(far,t)}});pts.push([b.x+Math.cos(ang)*Math.min(far,Math.max(W,H)),b.y+Math.sin(ang)*Math.min(far,Math.max(W,H))])}x.fillStyle='#c8ff3718';x.beginPath();x.moveTo(b.x,b.y);pts.forEach(p=>x.lineTo(...p));x.closePath();x.fill();x.strokeStyle='#9c5cffaa';x.lineWidth=1;x.beginPath();x.moveTo(b.x,b.y);pts.filter((_,i)=>i%18===0).forEach(p=>x.lineTo(...p));x.stroke();x.fillStyle='#c8ff37';x.beginPath();x.arc(b.x,b.y,7,0,7);x.fill()});count.textContent=beacons.length;area.textContent=beacons.length?Math.round(38+beacons.length*17)+'%':'—'}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();beacons.push({x:e.clientX-r.left,y:e.clientY-r.top});draw()});document.querySelector('#place').onclick=()=>{beacons.push({x:W*.5,y:H*.5});draw()};document.querySelector('#clear').onclick=()=>{beacons=[];draw()};addEventListener('resize',size);size()})();
</script></body></html>
