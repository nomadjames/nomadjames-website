<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Pixel Ocean</title><style>
:root{--cream:#e9f1cf;--mint:#a8c686;--green:#6d8b68;--deep:#27434b;--dark:#1e3035;--mono:"Courier New",monospace;--sans:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:var(--sans);overflow-x:hidden}.frame{max-width:960px;margin:32px auto;padding:0 22px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:4px solid var(--dark);padding-bottom:14px}.head h1{font:500 clamp(2.7rem,7vw,6rem)/.8 Georgia,serif;letter-spacing:-.06em;margin:0}.head p{font:11px var(--mono);text-align:right;max-width:210px}.game{margin:28px auto 0;background:var(--dark);padding:12px;max-width:860px;box-shadow:12px 12px 0 var(--mint)}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:var(--deep)}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:12px;background:var(--mint);border:1px solid var(--mint)}.hud div{background:var(--dark);color:var(--cream);padding:12px;font:11px var(--mono);text-transform:uppercase}.hud strong{display:block;color:var(--mint);font-size:20px;margin-top:5px}.instructions{display:flex;gap:20px;align-items:center;margin:30px 0;font:12px var(--mono)}.keys{display:flex;gap:4px}.keys kbd{border:1px solid var(--dark);padding:5px 8px;background:var(--cream)}button{background:var(--dark);color:var(--cream);border:0;padding:11px 14px;font:11px var(--mono);cursor:pointer}.log{border-top:1px solid var(--green);padding-top:12px;color:var(--green);font:12px var(--mono)}@media(max-width:600px){.frame{padding:0 14px}.head{display:block}.head p{text-align:left;margin-top:14px}.hud{grid-template-columns:repeat(2,1fr)}.instructions{flex-wrap:wrap}.game{padding:7px;box-shadow:7px 7px 0 var(--mint)}}
</style></head><body><main class="frame"><header class="head"><div><div style="font:11px var(--mono);letter-spacing:.13em">RESEARCH VESSEL 024 / LOW-RES LOG</div><h1>One Pixel<br>Ocean</h1></div><p>Navigate by the shape of the water. Every pixel is a tide, and every tide has somewhere to be.</p></header><section class="game"><canvas id="sea" width="160" height="92" tabindex="0" aria-label="Keyboard research vessel game"></canvas><div class="hud"><div>depth<strong id="depth">018 m</strong></div><div>specimen<strong id="count">00 / 04</strong></div><div>hull<strong id="hull">100%</strong></div><div>heading<strong id="heading">EAST</strong></div></div></section><section class="instructions"><span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>steer the vessel / collect the pale motes</span><button id="reset">RESET DIVE</button></section><p class="log" id="log">LOG 00: calm surface. the sea is holding its breath.</p></main><script>(()=>{const c=document.getElementById('sea'),x=c.getContext('2d'),W=160,H=92;let boat={x:26,y:44},keys={},found=0,hull=100,frame=0,motes=[{x:65,y:25},{x:105,y:62},{x:132,y:30},{x:81,y:76}];c.focus();addEventListener('keydown',e=>{keys[e.key]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=0);function draw(){frame++;let speed=.7;if(keys.ArrowLeft){boat.x-=speed;document.getElementById('heading').textContent='WEST'}if(keys.ArrowRight){boat.x+=speed;document.getElementById('heading').textContent='EAST'}if(keys.ArrowUp){boat.y-=speed;document.getElementById('heading').textContent='NORTH'}if(keys.ArrowDown){boat.y+=speed;document.getElementById('heading').textContent='SOUTH'}boat.x=Math.max(4,Math.min(154,boat.x));boat.y=Math.max(10,Math.min(87,boat.y));x.fillStyle='#27434b';x.fillRect(0,0,W,H);for(let y=0;y<H;y+=5){for(let i=0;i<32;i++){let xx=(i*7+Math.sin(frame/28+i)*3)%W;x.fillStyle=y<38?'#6d8b68':'#a8c686';x.fillRect((xx+W)%W,y,2,2)}}motes.forEach((m,i)=>{if(m){x.fillStyle='#e9f1cf';x.fillRect(m.x,m.y,3,3);if(Math.hypot(boat.x-m.x,boat.y-m.y)<5){found++;motes[i]=null;document.getElementById('log').textContent='LOG '+String(found).padStart(2,'0')+': specimen secured. the current approves.'}}});x.fillStyle='#e9f1cf';x.fillRect(boat.x-3,boat.y-2,7,5);x.fillStyle='#a8c686';x.fillRect(boat.x+4,boat.y,3,2);if(frame%100===0&&Math.random()<.3)hull=Math.max(0,hull-1);document.getElementById('depth').textContent=String(Math.round(18+boat.y*2.7)).padStart(3,'0')+' m';document.getElementById('count').textContent=String(found).padStart(2,'0')+' / 04';document.getElementById('hull').textContent=hull+'%';requestAnimationFrame(draw)}document.getElementById('reset').onclick=()=>{boat={x:26,y:44};found=0;hull=100;motes=[{x:65,y:25},{x:105,y:62},{x:132,y:30},{x:81,y:76}];document.getElementById('log').textContent='LOG 00: calm surface. the sea is holding its breath.'};draw()})();</script></body></html>
