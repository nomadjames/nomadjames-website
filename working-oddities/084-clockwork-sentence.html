<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clockwork Sentence</title><style>
:root{--brass:#b88a42;--brass2:#e1c27f;--blueprint:#173449;--cream:#f5ebd3;--ink:#12232d;--serif:Georgia,serif;--sans:system-ui,sans-serif;--mono:ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--blueprint);color:var(--cream);font-family:var(--sans);padding:26px 4vw 60px;overflow-x:hidden}.page{max-width:1180px;margin:auto}.eyebrow{font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--brass2)}.head{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid rgba(225,194,127,.5);padding-bottom:20px}h1{font:500 clamp(2.8rem,7vw,6.6rem)/.86 var(--serif);letter-spacing:-.065em;margin:18px 0 10px;color:var(--brass2)}.head p{max-width:370px;line-height:1.55}.machine{margin-top:24px;display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{border:1px solid rgba(225,194,127,.5);background:rgba(8,26,39,.55);padding:16px}.panel h2{font:500 1.45rem var(--serif);color:var(--brass2);margin:0 0 8px}.controls{display:grid;gap:14px}.field{display:grid;gap:6px;font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em}.field input,.field select{width:100%;background:var(--cream);border:0;padding:10px;font:14px var(--sans);color:var(--ink)}input[type=range]{accent-color:var(--brass)}button{background:var(--brass);color:var(--ink);border:0;padding:11px 13px;font:11px var(--mono);text-transform:uppercase;cursor:pointer}button.alt{background:transparent;color:var(--brass2);border:1px solid var(--brass)}button:hover{background:#efcf91}.gear-room{min-height:530px;background-color:#1c435a;background-image:linear-gradient(rgba(225,194,127,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(225,194,127,.08) 1px,transparent 1px);background-size:24px 24px;position:relative;overflow:hidden}.gear-room svg{width:100%;height:420px;display:block}.syntax{border-top:1px solid rgba(225,194,127,.5);padding-top:14px}.sentence{font:500 clamp(1.5rem,3vw,2.8rem)/1.15 var(--serif);color:var(--cream);margin:0 0 12px}.word{display:inline-block;margin-right:.28em;border-bottom:2px solid var(--brass);cursor:pointer}.word.active{color:var(--brass2);border-color:var(--cream)}.readout{font:12px var(--mono);color:var(--brass2);min-height:22px}.ratio{display:flex;justify-content:space-between;font:11px var(--mono);margin-top:12px;color:#a7c5d0}.gear{transform-box:fill-box;transform-origin:center}.tooth{fill:var(--brass);stroke:var(--brass2);stroke-width:2}.gear text{fill:var(--ink);font:600 11px var(--mono);text-anchor:middle;dominant-baseline:middle}.shaft{stroke:var(--brass2);stroke-width:4}@media(max-width:720px){body{padding:18px 12px 42px}.head{display:block}.head p{margin-top:20px}.machine{grid-template-columns:1fr}.gear-room{min-height:440px}.gear-room svg{height:320px}}
</style></head><body><main class="page"><div class="eyebrow">syntax engine 084 / brass logic department</div><header class="head"><div><h1>Clockwork<br>sentence</h1></div><p>Feed a sentence into the machine. Its grammar becomes a gear train: verbs turn faster, clauses carry torque, and punctuation decides where the teeth meet.</p></header><section class="machine"><aside class="panel controls"><h2>Input bay</h2><label class="field">sentence<textarea id="text" rows="5">The small machine remembers what the tired sentence forgot.</textarea></label><label class="field">structure<select id="structure"><option value="syntax">syntax ratio</option><option value="breath">breath ratio</option><option value="chaos">chaos ratio</option></select></label><label class="field">drive speed<input id="speed" type="range" min=".2" max="2.5" step=".1" value="1"></label><button id="run">pause train</button><button class="alt" id="rebuild">rebuild gears</button><div class="ratio" id="ratio">teeth / 0 · torque / 0</div></aside><div class="panel gear-room"><svg id="gears" viewBox="0 0 800 420" aria-label="Animated syntactic gear train"></svg><div class="syntax"><p class="sentence" id="sentence"></p><div class="readout" id="readout">hover a word to inspect its role</div></div></div></section></main><script>
(()=>{const text=document.querySelector('#text'),svg=document.querySelector('#gears'),sentence=document.querySelector('#sentence'),readout=document.querySelector('#readout'),speed=document.querySelector('#speed'),structure=document.querySelector('#structure'),ratio=document.querySelector('#ratio');let running=true,parts=[];function role(w,i,a){if(/[,;:.!?]/.test(w))return 'punctuation';if(/ing$|ed$|s$/.test(w)&&i>0)return 'verb / action';if(i===0)return 'determiner / subject';if(/the|a|an|small|tired|quiet|bright/i.test(w))return 'modifier';return i%3===0?'noun / weight':'connector / mesh'}function gear(cx,cy,r,teeth,label,turn){let pts=[];for(let i=0;i<teeth*2;i++){let rr=i%2?r:r*.82,ang=i*Math.PI/teeth;pts.push((cx+Math.cos(ang)*rr).toFixed(1)+','+(cy+Math.sin(ang)*rr).toFixed(1))}return '<g class="gear" data-turn="'+turn+'" transform="rotate(0 '+cx+' '+cy+')"><polygon class="tooth" points="'+pts.join(' ')+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.28)+'" fill="#173449" stroke="#e1c27f" stroke-width="3"/><text x="'+cx+'" y="'+cy+'">'+label+'</text></g>'}function build(){let words=text.value.trim().split(/\s+/).filter(Boolean);parts=words;sentence.innerHTML=words.map((w,i)=>'<span class="word" data-i="'+i+'">'+w+'</span>').join(' ');let count=Math.min(words.length,13),out='<path class="shaft" d="M60 212H740"/>';for(let i=0;i<count;i++){let r=26+(words[i].length%5)*5,x=70+i*54,y=212+(i%2?30:-30),t=role(words[i],i,words);out+=gear(x,y,r,8+(i%4),String(i+1).padStart(2,'0'),i%2?'-.6':'1');if(i<count-1)out+='<line class="shaft" x1="'+(x+r*.9)+'" y1="'+y+'" x2="'+(x+54-r*.9)+'" y2="'+(212+((i+1)%2?30:-30))+'"/>'}svg.innerHTML=out;ratio.textContent='teeth / '+words.reduce((n,w)=>n+w.length,0)+' · torque / '+Math.round(words.length*12);document.querySelectorAll('.word').forEach(el=>{el.onmouseenter=()=>{document.querySelectorAll('.word').forEach(w=>w.classList.remove('active'));el.classList.add('active');let i=Number(el.dataset.i);readout.textContent='word '+(i+1)+' / '+role(words[i],i,words)+' / gear ratio '+(1+(words[i].length%4))+' : 1'}})}function tick(){if(running){document.querySelectorAll('.gear').forEach((g,i)=>{let a=(performance.now()/1000)*Number(speed.value)*(i%2?-.65:1);let p=g.querySelector('polygon'),b=g.getAttribute('transform').match(/(\d+\.\d+)\s+(\d+\.\d+)/);let box=g.getBBox();let cx=box.x+box.width/2,cy=box.y+box.height/2;g.setAttribute('transform','rotate('+a+' '+cx+' '+cy+')')})}requestAnimationFrame(tick)}text.oninput=build;structure.onchange=build;speed.oninput=()=>{};document.querySelector('#rebuild').onclick=build;document.querySelector('#run').onclick=()=>{running=!running;document.querySelector('#run').textContent=running?'pause train':'resume train'};build();tick()})();
</script></body></html>
