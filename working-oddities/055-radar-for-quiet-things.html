<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar for Quiet Things</title><style>
:root{--olive:#59633d;--olive-dark:#252b20;--lime:#d9f26c;--blush:#e79a9e;--paper:#f5f0df}*{box-sizing:border-box}body{margin:0;background:var(--olive-dark);color:var(--paper);font:14px/1.4 ui-monospace,monospace;overflow-x:hidden}.layout{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(20px,5vw,70px);align-items:center;max-width:1250px;margin:auto;padding:clamp(22px,5vw,70px)}.radar-wrap{position:relative;aspect-ratio:1;max-width:700px;margin:auto;width:100%}.radar{position:absolute;inset:3%;border-radius:50%;background:repeating-radial-gradient(circle,var(--olive) 0 1px,transparent 2px 18%),conic-gradient(from 0deg,#d9f26c00,#d9f26c38 9deg,#d9f26c00 33deg);border:2px solid var(--lime);box-shadow:0 0 0 12px #d9f26c10,0 0 70px #d9f26c22;overflow:hidden}.radar:before,.radar:after{content:"";position:absolute;background:#d9f26c66}.radar:before{height:1px;left:0;right:0;top:50%}.radar:after{width:1px;top:0;bottom:0;left:50%}.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 310deg,#d9f26c55 350deg,#d9f26c 360deg);animation:sweep 4s linear infinite}@keyframes sweep{to{transform:rotate(360deg)}}.center{position:absolute;width:12px;height:12px;background:var(--lime);border-radius:50%;left:calc(50% - 6px);top:calc(50% - 6px);box-shadow:0 0 13px var(--lime)}.blip{position:absolute;width:11px;height:11px;background:var(--blush);border-radius:50%;box-shadow:0 0 0 5px #e79a9e27,0 0 15px var(--blush);transform:translate(-50%,-50%);z-index:3}.blip i{position:absolute;top:15px;left:8px;color:var(--blush);font-style:normal;font-size:10px;white-space:nowrap}.mesh{position:absolute;inset:3%;pointer-events:none;z-index:2}.mesh line{stroke:var(--blush);stroke-width:1;stroke-dasharray:3 4;opacity:.8}.copy{align-self:stretch;display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--lime);letter-spacing:.2em;font-size:11px}.copy h1{font:clamp(48px,7vw,100px)/.8 Georgia,serif;letter-spacing:-.08em;margin:18px 0}.copy p{color:#c2c6a6;max-width:290px}.readout{border-top:1px solid #596b45;margin-top:28px;padding-top:18px;color:#99a377;font-size:11px}.readout b{color:var(--blush)}.hint{color:var(--lime);margin-top:18px;font-size:11px}button{background:var(--lime);border:0;color:var(--olive-dark);font:inherit;padding:11px 14px;margin-top:25px;cursor:pointer}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:28px 18px}.radar-wrap{order:2;width:min(88vw,500px)}.copy{order:1}.copy h1{font-size:58px}.copy p{margin-bottom:0}}
</style></head><body><div class="layout"><section class="radar-wrap" id="scope" aria-label="Radar field. Click to triangulate a quiet thing"><div class="radar"><div class="sweep"></div><div class="center"></div></div><svg class="mesh" id="mesh" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></section><section class="copy"><div class="kicker">LISTENING STATION 05</div><h1>Radar for<br>quiet things</h1><p>There are signals too shy for a notification. Click the field; three receivers will agree on where the hush is hiding.</p><div class="readout">TRACKS ACQUIRED <b id="count">0</b><br>LAST SIGNAL <b id="last">none</b></div><div class="hint">● click anywhere in the green field</div><button id="clear">clear field</button></section></div><script>
(()=>{const s=document.querySelector('#scope'),radar=document.querySelector('.radar'),mesh=document.querySelector('#mesh'),count=document.querySelector('#count'),last=document.querySelector('#last');let n=0;s.addEventListener('pointerdown',e=>{if(!e.target.closest('.radar'))return;const r=radar.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,idx=++n;const b=document.createElement('span');b.className='blip';b.style.left=x+'%';b.style.top=y+'%';b.innerHTML='<i>Q-'+String(idx).padStart(2,'0')+'</i>';radar.append(b);const line=document.createElementNS('http'+':\/\/www.w3.org/2000/svg','line');line.setAttribute('x1','50');line.setAttribute('y1','50');line.setAttribute('x2',x);line.setAttribute('y2',y);mesh.append(line);count.textContent=n;last.textContent='Q-'+String(idx).padStart(2,'0')+' / '+Math.round(x)+'° field';});document.querySelector('#clear').onclick=()=>{document.querySelectorAll('.blip').forEach(x=>x.remove());mesh.innerHTML='';n=0;count.textContent=0;last.textContent='none'};})();
</script></body></html>
