<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Palace Elevator</title>
<style>
:root{--burg:#3b1425;--burg2:#5a2139;--brass:#c59652;--rose:#c99aa0;--dust:#ead9d1;--dark:#24121b}*{box-sizing:border-box}body{margin:0;background:var(--dust);color:var(--dark);font-family:Georgia,serif;min-height:100vh}.top{padding:22px 5vw;border-bottom:1px solid rgba(59,20,37,.25);display:flex;justify-content:space-between;font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.13em;color:var(--burg)}.top b{color:var(--burg2)}main{max-width:1120px;margin:auto;display:grid;grid-template-columns:250px 1fr 220px;gap:45px;align-items:center;padding:55px 5vw}.intro h1{font-size:clamp(40px,5vw,78px);line-height:.88;margin:0 0 18px;font-weight:400;letter-spacing:-.07em}.intro p{font-size:16px;line-height:1.6}.intro small{font:11px ui-monospace,monospace;color:var(--burg2)}.shaft{height:600px;background:linear-gradient(90deg,#28141d,var(--burg) 12%,#6a2b43 50%,var(--burg) 88%,#28141d);border:8px solid var(--dark);padding:30px;perspective:900px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 40px #170b11}.cage{width:100%;height:100%;border:2px solid var(--brass);position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.18,.8,.24,1)}.cage:before,.cage:after{content:'';position:absolute;inset:10px;border:1px solid rgba(197,150,82,.38);transform:translateZ(40px)}.cage:after{inset:28px;transform:translateZ(70px)}.room{position:absolute;inset:16%;display:grid;place-items:center;text-align:center;color:var(--dust);transform:translateZ(95px);padding:20px}.room .floor{font:11px ui-monospace,monospace;color:var(--brass);letter-spacing:.18em}.room h2{font-size:34px;line-height:.95;font-weight:400;margin:14px 0}.room p{font-size:14px;color:#e1c4c1}.door{position:absolute;left:25%;right:25%;bottom:0;height:33%;border:1px solid var(--brass);background:linear-gradient(90deg,transparent 48%,rgba(197,150,82,.25) 49%,transparent 50%);transform:translateZ(120px);transform-origin:bottom;transition:transform 1s}.cage.open .door{transform:translateZ(120px) rotateX(-75deg)}.panel{background:var(--burg);color:var(--dust);padding:20px;border:1px solid var(--brass)}.display{font:700 40px ui-monospace,monospace;color:var(--brass);text-align:center;border-bottom:1px solid rgba(197,150,82,.4);padding-bottom:14px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.keys button{aspect-ratio:1;background:var(--burg2);border:1px solid rgba(197,150,82,.65);color:var(--dust);cursor:pointer}.keys button:hover{background:var(--brass);color:var(--burg)}.go{width:100%;margin-top:12px;border:0;background:var(--brass);color:var(--dark);padding:11px;cursor:pointer;font-weight:bold}.read{margin-top:13px;font:11px/1.5 ui-monospace,monospace;color:var(--rose)}
@media(max-width:900px){main{grid-template-columns:1fr;padding:35px 20px;gap:25px}.intro{text-align:center}.shaft{height:470px;padding:22px}.panel{max-width:300px;margin:auto}.top{padding:20px}}
</style></head><body><header class="top"><span>THE MEMORY PALACE / LIFT 03</span><b id="now">00:00:00</b></header><main><section class="intro"><small>TYPE A ROOM, THEN RIDE</small><h1>Go where<br>you remember.</h1><p>An elevator for semantic rooms. Name the floor and the doors will build an image from the words.</p></section><section class="shaft"><div class="cage" id="cage"><div class="room"><div class="floor" id="floor">FLOOR 00</div><h2 id="roomTitle">Lobby of Almost</h2><p id="roomText">The brass doors wait for a word.</p></div><div class="door"></div></div></section><aside class="panel"><div class="display" id="display">00</div><div class="keys"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button></div><button class="go" id="go">Ride to floor</button><div class="read">Type a room below<br><input id="roomInput" placeholder="e.g. rain / attic" style="width:100%;margin-top:7px;padding:8px;background:var(--dust);border:0;color:var(--dark)"></div></aside></main><script>(()=>{let floor=0;const $=s=>document.querySelector(s),display=$('#display');document.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{floor=+b.textContent;display.textContent=String(floor).padStart(2,'0')});$('#go').onclick=()=>{let word=$('#roomInput').value.trim()||['Almost','Salt','Sunday','Unsent','Rain','Attic','First Light','Home','Elsewhere'][floor-1]||'Lobby of Almost';$('#floor').textContent='FLOOR '+String(floor).padStart(2,'0');$('#roomTitle').textContent=word.replace(/^./,x=>x.toUpperCase());$('#roomText').textContent='A room made from '+word+'. Dust settles on the objects you chose not to name.';$('#cage').classList.remove('open');void $('#cage').offsetWidth;$('#cage').style.transform=`translateZ(${floor*5}px) rotateX(${floor*2}deg)`;setTimeout(()=>$('#cage').classList.add('open'),900)};document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)){floor=+e.key;display.textContent='0'+floor}if(e.key==='Enter')$('#go').click()});setInterval(()=>{$('#now').textContent=new Date().toLocaleTimeString([], {hour12:false})},1000)})();</script></body></html>
