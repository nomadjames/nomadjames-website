<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unstable Bauhaus</title>
<style>
:root{--paper:#efe7d5;--ink:#171717;--red:#e43e30;--blue:#164c9c;--yellow:#f5c332;--line:#b9ad99}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;overflow-x:hidden}.nav{height:76px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:0 5vw}.nav strong{font-size:14px;letter-spacing:.05em}.nav span{font-size:11px;text-transform:uppercase;letter-spacing:.12em}.main{max-width:1300px;margin:auto;display:grid;grid-template-columns:300px 1fr;gap:55px;padding:55px 5vw}.copy h1{font-size:clamp(42px,6vw,92px);line-height:.82;letter-spacing:-.09em;margin:0 0 22px;font-weight:900}.copy p{max-width:245px;font-size:15px;line-height:1.6}.copy button{border:2px solid var(--ink);background:var(--yellow);padding:10px 14px;font-weight:bold;cursor:pointer;margin-top:20px}.board{position:relative;min-height:670px;background:#e7ddc8;border:3px solid var(--ink);overflow:hidden;background-image:linear-gradient(90deg,transparent 49.8%,rgba(23,23,23,.08) 50%,transparent 50.2%),linear-gradient(transparent 49.8%,rgba(23,23,23,.08) 50%,transparent 50.2%);background-size:25% 25%}.board:after{content:'DRAG / COMPOSE / BALANCE';position:absolute;right:18px;bottom:16px;font-size:10px;letter-spacing:.14em}.shape{position:absolute;cursor:grab;touch-action:none;user-select:none;box-shadow:8px 9px 0 rgba(23,23,23,.12)}.shape:active{cursor:grabbing}.circle{width:170px;height:170px;border-radius:50%;background:var(--red);left:21%;top:18%}.square{width:190px;height:190px;background:var(--blue);right:15%;top:35%}.bar{width:330px;height:42px;background:var(--yellow);left:12%;bottom:19%;transform:rotate(-14deg)}.triangle{width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:170px solid var(--ink);left:48%;top:11%;filter:drop-shadow(8px 9px 0 rgba(23,23,23,.12));box-shadow:none}.meter{margin-top:25px;border-top:3px solid var(--ink);padding-top:12px}.meter-head{display:flex;justify-content:space-between;font-weight:bold;font-size:12px;text-transform:uppercase}.track{height:20px;border:2px solid var(--ink);margin-top:9px;background:var(--paper)}.fill{height:100%;width:50%;background:var(--red);transition:width .25s,background .25s}.verdict{font-size:12px;margin-top:8px}.axis{display:flex;justify-content:space-between;font-size:10px;margin-top:5px}
@media(max-width:800px){.main{grid-template-columns:1fr;padding:35px 20px;gap:28px}.copy{text-align:center}.copy p{margin:auto}.board{min-height:500px}.circle{width:115px;height:115px;left:16%;top:20%}.square{width:125px;height:125px;right:12%;top:38%}.bar{width:220px;height:30px;left:8%;bottom:20%}.triangle{border-left-width:60px;border-right-width:60px;border-bottom-width:120px;left:43%;top:14%}}
</style></head><body><header class="nav"><strong>UNSTABLE BAUHAUS / 016</strong><span>an exercise in visible gravity</span></header><main class="main"><section class="copy"><div>POSTER LAB</div><h1>Make it<br>lean.</h1><p>Four primary forms are loose on the paper. Arrange them until the composition carries its own weight.</p><button id="shuffle">Shuffle forms</button><div class="meter"><div class="meter-head"><span>center-of-mass</span><span id="percent">50%</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="axis"><span>left heavy</span><span>balanced</span><span>right heavy</span></div><div class="verdict" id="verdict">A small correction will steady the poster.</div></div></section><section class="board" id="board" aria-label="Draggable poster board"><div class="shape circle" data-weight="3"></div><div class="shape square" data-weight="5"></div><div class="shape bar" data-weight="2"></div><div class="shape triangle" data-weight="4"></div></section></main><script>(()=>{const board=document.querySelector('#board'),shapes=[...document.querySelectorAll('.shape')];let drag=null,off=[0,0];function meter(){let r=board.getBoundingClientRect(),sum=0,w=0;shapes.forEach(s=>{let b=s.getBoundingClientRect(),x=(b.left+b.width/2-r.left)/r.width;sum+=x*+s.dataset.weight;w+=+s.dataset.weight});let p=Math.round(sum/w*100);p=Math.max(0,Math.min(100,p));document.querySelector('#percent').textContent=p+'%';document.querySelector('#fill').style.width=p+'%';document.querySelector('#fill').style.background=p>42&&p<58?'var(--blue)':'var(--red)';document.querySelector('#verdict').textContent=p>46&&p<54?'Composition balanced. Stop touching it.':p<50?'Shift a form right.':'Shift a form left.'}shapes.forEach(s=>s.addEventListener('pointerdown',e=>{let b=s.getBoundingClientRect();drag=s;off=[e.clientX-b.left,e.clientY-b.top];s.setPointerCapture(e.pointerId)}));document.addEventListener('pointermove',e=>{if(!drag)return;let r=board.getBoundingClientRect(),x=e.clientX-r.left-off[0],y=e.clientY-r.top-off[1];drag.style.left=Math.max(0,Math.min(r.width-drag.offsetWidth,x))+'px';drag.style.top=Math.max(0,Math.min(r.height-drag.offsetHeight,y))+'px';drag.style.right='auto';drag.style.bottom='auto';meter()});document.addEventListener('pointerup',()=>drag=null);document.querySelector('#shuffle').onclick=()=>{shapes.forEach((s,i)=>{s.style.left=(10+Math.random()*70)+'%';s.style.top=(8+Math.random()*72)+'%';s.style.right='auto';s.style.bottom='auto';s.style.transform=i===2?'rotate('+(Math.random()*30-15)+'deg)':''});meter()};meter();window.addEventListener('resize',meter)})();</script></body></html>
