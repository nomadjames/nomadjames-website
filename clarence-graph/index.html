/script><iframe srcDoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
  &lt;title&gt;Clarence Knowledge Graph&lt;/title&gt;
  &lt;script src=&quot;https://unpkg.com/vis-network/standalone/umd/vis-network.min.js&quot;&gt;&lt;/script&gt;
  &lt;style&gt;
    /* === Reset &amp; Base === */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: -apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif; }

    /* === Graph Container === */
    #graph { width: 100%; height: 100%; }

    /* === Loading Overlay === */
    #loader {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #050505; transition: opacity 0.6s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader .spinner {
      width: 32px; height: 32px; border: 2px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loader .progress {
      margin-top: 12px; font-size: 11px; color: rgba(255,255,255,0.3);
      letter-spacing: 0.5px; text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* === Stats Badge (top-right) === */
    #stats {
      position: fixed; top: 12px; right: 12px; z-index: 50;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.06); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 11px; color: rgba(255,255,255,0.45);
      letter-spacing: 0.3px; opacity: 0; transition: opacity 0.6s ease;
    }
    #stats.visible { opacity: 1; }

    /* === Legend (bottom-left) === */
    #legend {
      position: fixed; bottom: 12px; left: 12px; z-index: 50;
      padding: 10px 14px; border-radius: 8px;
      background: rgba(255,255,255,0.04); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; gap: 5px;
      opacity: 0; transition: opacity 0.6s ease;
    }
    #legend.visible { opacity: 1; }
    .legend-item {
      display: flex; align-items: center; gap: 7px;
      font-size: 10px; color: rgba(255,255,255,0.4);
      text-transform: capitalize;
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    /* === Node Tooltip === */
    #tooltip {
      position: fixed; z-index: 60; pointer-events: none;
      padding: 8px 12px; border-radius: 6px;
      background: rgba(15,15,15,0.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      opacity: 0; transition: opacity 0.15s ease; transform: translate(-50%, -100%);
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .tt-name { font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 500; }
    #tooltip .tt-type { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; text-transform: capitalize; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;!-- Loading overlay --&gt;
  &lt;div id=&quot;loader&quot;&gt;
    &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;progress&quot; id=&quot;progress&quot;&gt;Loading graph…&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- Stats badge --&gt;
  &lt;div id=&quot;stats&quot;&gt;&lt;/div&gt;

  &lt;!-- Legend (populated dynamically) --&gt;
  &lt;div id=&quot;legend&quot;&gt;&lt;/div&gt;

  &lt;!-- Node tooltip --&gt;
  &lt;div id=&quot;tooltip&quot;&gt;
    &lt;div class=&quot;tt-name&quot; id=&quot;tt-name&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;tt-type&quot; id=&quot;tt-type&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- Graph canvas --&gt;
  &lt;div id=&quot;graph&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    // =========================================================================
    // Configuration
    // =========================================================================
    const TYPE_STYLES = {
      concept:       { color: &#x27;#6366f1&#x27;, shape: &#x27;dot&#x27;,     label: &#x27;Concept&#x27; },
      tool:          { color: &#x27;#f97316&#x27;, shape: &#x27;diamond&#x27;,  label: &#x27;Tool&#x27; },
      project:       { color: &#x27;#22c55e&#x27;, shape: &#x27;square&#x27;,   label: &#x27;Project&#x27; },
      course:        { color: &#x27;#eab308&#x27;, shape: &#x27;triangle&#x27;, label: &#x27;Course&#x27; },
      research:      { color: &#x27;#8b5cf6&#x27;, shape: &#x27;star&#x27;,     label: &#x27;Research&#x27; },
      &#x27;research-topic&#x27;: { color: &#x27;#8b5cf6&#x27;, shape: &#x27;star&#x27;,  label: &#x27;Research&#x27; },
      research_topic:   { color: &#x27;#8b5cf6&#x27;, shape: &#x27;star&#x27;,  label: &#x27;Research&#x27; },
      organization:  { color: &#x27;#14b8a6&#x27;, shape: &#x27;hexagon&#x27;,  label: &#x27;Organization&#x27; },
      company:       { color: &#x27;#14b8a6&#x27;, shape: &#x27;hexagon&#x27;,  label: &#x27;Organization&#x27; },
      institution:   { color: &#x27;#14b8a6&#x27;, shape: &#x27;hexagon&#x27;,  label: &#x27;Organization&#x27; },
    };
    const DEFAULT_STYLE = { color: &#x27;#64748b&#x27;, shape: &#x27;dot&#x27;, label: &#x27;Other&#x27; };

    function getStyle(type) {
      return TYPE_STYLES[(type || &#x27;&#x27;).toLowerCase()] || DEFAULT_STYLE;
    }

    // Read URL params for optional type filter
    const params = new URLSearchParams(window.location.search);
    const filterType = params.get(&#x27;type&#x27;);

    // =========================================================================
    // Load Data &amp; Build Graph
    // =========================================================================
    (async function init() {
      const progressEl = document.getElementById(&#x27;progress&#x27;);
      const loaderEl = document.getElementById(&#x27;loader&#x27;);

      // Fetch graph data from static JSON
      let data;
      try {
        const res = await fetch(&#x27;/clarence-graph/graph-data.json&#x27;);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        data = await res.json();
      } catch (err) {
        progressEl.textContent = &#x27;Failed to load graph data&#x27;;
        console.error(&#x27;Graph load error:&#x27;, err);
        return;
      }

      progressEl.textContent = &#x27;Building graph…&#x27;;

      // --- Filter nodes by type if ?type= param is set ---
      let nodes = data.nodes || [];
      let edges = data.edges || [];
      if (filterType) {
        const ft = filterType.toLowerCase();
        const allowedIds = new Set(nodes.filter(n =&gt; (n.type || &#x27;&#x27;).toLowerCase() === ft).map(n =&gt; n.id));
        nodes = nodes.filter(n =&gt; allowedIds.has(n.id));
        edges = edges.filter(e =&gt; allowedIds.has(e.from) &amp;&amp; allowedIds.has(e.to));
      }

      // The entity catalog contains many records with facts but no graph relation.
      // Keep this view legible by showing only nodes that participate in an edge.
      const connectedIds = new Set();
      edges.forEach(edge =&gt; {
        connectedIds.add(edge.from);
        connectedIds.add(edge.to);
      });
      const unlinkedCount = nodes.filter(node =&gt; !connectedIds.has(node.id)).length;
      nodes = nodes.filter(node =&gt; connectedIds.has(node.id));

      // --- Build vis-network DataSets ---
      const visNodes = new vis.DataSet(nodes.map(n =&gt; {
        const style = getStyle(n.type);
        const conns = n.connections ?? 0;
        const size = Math.min(35, Math.max(8, 8 + Math.log(conns + 1) * 6));
        return {
          id: n.id,
          label: &#x27;&#x27;,
          shape: style.shape,
          size: size,
          color: {
            background: style.color,
            border: style.color,
            highlight: { background: style.color, border: &#x27;#fff&#x27; },
            hover: { background: style.color, border: &#x27;#fff&#x27; },
          },
          font: { color: &#x27;rgba(255,255,255,0.75)&#x27;, size: 11, face: &#x27;-apple-system, sans-serif&#x27; },
          borderWidth: 0,
          borderWidthSelected: 2,
          // Store metadata for generic public-safe tooltip text
          _type: n.type || &#x27;unknown&#x27;,
          _connections: conns,
        };
      }));

      const visEdges = new vis.DataSet(edges.map(e =&gt; {
        const implicit = e.implicit === true;
        return {
          from: e.from,
          to: e.to,
          color: {
            color: implicit ? &#x27;rgba(255,255,255,0.08)&#x27; : &#x27;rgba(255,255,255,0.15)&#x27;,
            highlight: &#x27;rgba(255,255,255,0.4)&#x27;,
            hover: &#x27;rgba(255,255,255,0.3)&#x27;,
          },
          dashes: implicit ? [4, 4] : false,
          width: implicit ? 0.5 : 0.8,
          smooth: { type: &#x27;continuous&#x27;, roundness: 0.2 },
        };
      }));

      // --- Network Options ---
      const options = {
        nodes: {
          scaling: {
            label: { enabled: true, min: 14, max: 22, drawThreshold: 9 },
          },
        },
        edges: {
          selectionWidth: 1.5,
          hoverWidth: 0.5,
        },
        physics: {
          solver: &#x27;barnesHut&#x27;,
          barnesHut: {
            gravitationalConstant: -3000,
            springLength: 200,
            springConstant: 0.02,
            damping: 0.15,
          },
          stabilization: {
            enabled: true,
            iterations: 150,
            updateInterval: 15,
          },
          // Keep gently floating after stabilization
          minVelocity: 0.3,
          maxVelocity: 8,
        },
        interaction: {
          hover: true,
          tooltipDelay: 9999999,  // Disable built-in tooltips
          zoomView: true,
          dragView: true,
          dragNodes: true,
          navigationButtons: false,
          keyboard: false,
        },
        layout: { improvedLayout: true },
      };

      // --- Create Network ---
      const container = document.getElementById(&#x27;graph&#x27;);
      const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, options);

      // --- Stabilization Progress ---
      network.on(&#x27;stabilizationProgress&#x27;, (p) =&gt; {
        const pct = Math.round((p.iterations / p.total) * 100);
        progressEl.textContent = `Stabilizing… ${pct}%`;
      });

      network.on(&#x27;stabilizationIterationsDone&#x27;, () =&gt; {
        // Fade out loader
        loaderEl.classList.add(&#x27;hidden&#x27;);
        setTimeout(() =&gt; { loaderEl.style.display = &#x27;none&#x27;; }, 700);

        // Show UI elements
        document.getElementById(&#x27;stats&#x27;).classList.add(&#x27;visible&#x27;);
        document.getElementById(&#x27;legend&#x27;).classList.add(&#x27;visible&#x27;);
      });

      // --- Populate Stats Badge ---
      const nodeCount = nodes.length;
      const edgeCount = edges.length;
      const snapshotDate = data.generated
        ? new Date(data.generated).toLocaleDateString(&#x27;en-US&#x27;, {
            month: &#x27;short&#x27;, day: &#x27;numeric&#x27;, year: &#x27;numeric&#x27;, timeZone: &#x27;UTC&#x27;,
          })
        : &#x27;date unavailable&#x27;;
      document.getElementById(&#x27;stats&#x27;).textContent = `${nodeCount} connected · ${edgeCount} links · ${unlinkedCount} unlinked omitted · ${snapshotDate}`;

      // --- Populate Legend (only types present in data) ---
      const typesPresent = new Map();
      nodes.forEach(n =&gt; {
        const t = (n.type || &#x27;&#x27;).toLowerCase();
        if (!typesPresent.has(t)) {
          const s = getStyle(t);
          typesPresent.set(t, s);
        }
      });

      const legendEl = document.getElementById(&#x27;legend&#x27;);
      // Deduplicate by label (research variants merge)
      const legendSeen = new Set();
      typesPresent.forEach((style, type) =&gt; {
        if (legendSeen.has(style.label)) return;
        legendSeen.add(style.label);
        const item = document.createElement(&#x27;div&#x27;);
        item.className = &#x27;legend-item&#x27;;
        item.innerHTML = `&lt;span class=&quot;legend-dot&quot; style=&quot;background:${style.color}&quot;&gt;&lt;/span&gt;${style.label}`;
        legendEl.appendChild(item);
      });

      // =======================================================================
      // Interactivity
      // =======================================================================
      const tooltipEl = document.getElementById(&#x27;tooltip&#x27;);
      const ttName = document.getElementById(&#x27;tt-name&#x27;);
      const ttType = document.getElementById(&#x27;tt-type&#x27;);
      let highlightActive = false;

      // --- Hover: highlight node + neighbors, dim the rest ---
      network.on(&#x27;hoverNode&#x27;, (e) =&gt; {
        highlightActive = true;
        const nodeId = e.node;
        const connectedNodes = network.getConnectedNodes(nodeId);
        const connectedEdges = network.getConnectedEdges(nodeId);
        const allNodeIds = visNodes.getIds();
        const allEdgeIds = visEdges.getIds();

        // Dim all nodes
        const nodeUpdates = allNodeIds.map(id =&gt; {
          const isHighlighted = id === nodeId || connectedNodes.includes(id);
          return { id, opacity: isHighlighted ? 1.0 : 0.12 };
        });
        visNodes.update(nodeUpdates);

        // Dim all edges
        const connectedEdgeSet = new Set(connectedEdges);
        const edgeUpdates = allEdgeIds.map(id =&gt; ({
          id, hidden: !connectedEdgeSet.has(id),
        }));
        visEdges.update(edgeUpdates);
      });

      network.on(&#x27;blurNode&#x27;, () =&gt; {
        if (!highlightActive) return;
        highlightActive = false;
        // Restore all nodes
        visNodes.update(visNodes.getIds().map(id =&gt; ({ id, opacity: 1.0 })));
        // Restore all edges
        visEdges.update(visEdges.getIds().map(id =&gt; ({ id, hidden: false })));
      });

      // --- Click: show tooltip near node ---
      network.on(&#x27;click&#x27;, (e) =&gt; {
        if (e.nodes.length &gt; 0) {
          const nodeId = e.nodes[0];
          const nodeData = visNodes.get(nodeId);
          const style = getStyle(nodeData._type);
          const connectionLabel = nodeData._connections === 1 ? &#x27;1 connection&#x27; : `${nodeData._connections} connections`;
          ttName.textContent = `${style.label} node`;
          ttType.textContent = connectionLabel;
          // Position tooltip at click location
          tooltipEl.style.left = e.event.center.x + &#x27;px&#x27;;
          tooltipEl.style.top = (e.event.center.y - 12) + &#x27;px&#x27;;
          tooltipEl.classList.add(&#x27;visible&#x27;);
        } else {
          tooltipEl.classList.remove(&#x27;visible&#x27;);
        }
      });

      // Hide tooltip on drag/zoom
      network.on(&#x27;dragStart&#x27;, () =&gt; tooltipEl.classList.remove(&#x27;visible&#x27;));
      network.on(&#x27;zoom&#x27;, () =&gt; tooltipEl.classList.remove(&#x27;visible&#x27;));

      // --- Double-click: zoom to neighborhood ---
      network.on(&#x27;doubleClick&#x27;, (e) =&gt; {
        if (e.nodes.length &gt; 0) {
          const nodeId = e.nodes[0];
          const neighbors = network.getConnectedNodes(nodeId);
          const fitNodes = [nodeId, ...neighbors];
          network.fit({ nodes: fitNodes, animation: { duration: 500, easingFunction: &#x27;easeInOutQuad&#x27; } });
        }
      });

      // Disable right-click context menu
      container.addEventListener(&#x27;contextmenu&#x27;, (e) =&gt; e.preventDefault());

    })();
  &lt;/script&gt;

   }\n    @keyframes spin { to { transform: rotate(360deg); } }\n\n    /* === Stats Badge (top-right) === */\n    #stats {\n      position: fixed; top: 12px; right: 12px; z-index: 50;\n      padding: 6px 12px; border-radius: 20px;\n      background: rgba(255,255,255,0.06); backdrop-filter: blur(8px);\n      border: 1px solid rgba(255,255,255,0.08);\n      font-size: 11px; color: rgba(255,255,255,0.45);\n      letter-spacing: 0.3px; opacity: 0; transition: opacity 0.6s ease;\n    }\n    #stats.visible { opacity: 1; }\n\n    /* === Legend (bottom-left) === */\n    #legend {\n      position: fixed; bottom: 12px; left: 12px; z-index: 50;\n      padding: 10px 14px; border-radius: 8px;\n      background: rgba(255,255,255,0.04); backdrop-filter: blur(8px);\n      border: 1px solid rgba(255,255,255,0.06);\n      display: flex; flex-direction: column; gap: 5px;\n      opacity: 0; transition: opacity 0.6s ease;\n    }\n    #legend.visible { opacity: 1; }\n    .legend-item {\n      display: flex; align-items: center; gap: 7px;\n      font-size: 10px; color: rgba(255,255,255,0.4);\n      text-transform: capitalize;\n    }\n    .legend-dot {\n      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;\n    }\n\n    /* === Node Tooltip === */\n    #tooltip {\n      position: fixed; z-index: 60; pointer-events: none;\n      padding: 8px 12px; border-radius: 6px;\n      background: rgba(15,15,15,0.92); backdrop-filter: blur(10px);\n      border: 1px solid rgba(255,255,255,0.1);\n      opacity: 0; transition: opacity 0.15s ease; transform: translate(-50%, -100%);\n    }\n    #tooltip.visible { opacity: 1; }\n    #tooltip .tt-name { font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 500; }\n    #tooltip .tt-type { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; text-transform: capitalize; }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003c!-- Loading overlay --\u003e\n  \u003cdiv id=\"loader\"\u003e\n    \u003cdiv class=\"spinner\" earch);\n    const filterType = params.get('type');\n\n    // =========================================================================\n    // Load Data \u0026 Build Graph\n    // =========================================================================\n    (async function init() {\n      const progressEl = document.getElementById('progress');\n      const loaderEl = document.getElementById('loader');\n\n      // Fetch graph data from static JSON\n      let data;\n      try {\n        const res = await fetch('/clarence-graph/graph-data.json');\n        if (!res.ok) throw new Error(`HTTP ${res.status}`);\n        data = await res.json();\n      } catch (err) {\n        progressEl.textContent = 'Failed to load graph data';\n        console.error('Graph load error:', err);\n        return;\n      }\n\n      progressEl.textContent = 'Building graph…';\n\n      // --- Filter nodes by type if ?type= param is set ---\n      let nodes = data.nodes || [];\n      let edges = data.edges || [];\n      if (filterType) {\n        const ft = filterType.toLowerCase();\n        const allowedIds = new Set(nodes.filter(n =\u003e (n.type || '').toLowerCase() === ft).map(n =\u003e n.id));\n        nodes = nodes.filter(n =\u003e allowedIds.has(n.id));\n        edges = edges.filter(e =\u003e allowedIds.has(e.from) \u0026\u0026 allowedIds.has(e.to));\n      }\n\n      // The entity catalog contains many records with facts but no graph relation.\n      // Keep this view legible by showing only nodes that participate in an edge.\n      const connectedIds = new Set();\n      edges.forEach(edge =\u003e {\n        connectedIds.add(edge.from);\n        connectedIds.add(edge.to);\n      });\n      const unlinkedCount = nodes.filter(node =\u003e !connectedIds.has(node.id)).length;\n      nodes = nodes.filter(node =\u003e connectedIds.has(node.id));\n\n      // --- Build vis-network DataSets ---\n      const visNodes = new vis.DataSet(nodes.map(n =\u003e {\n        const style = getStyle(n.type);\n        const conns = n.connections ?? 0;\n        const size = Math.min(35, Math.max(8, 8 + Math.log(conns + 1) * 6));\n        return {\n          id: n.id,\n          label: '',\n          shape: style.shape,\n          size: size,\n          color: {\n            background: style.color,\n            border: style.color,\n            highlight: { background: style.color, border: '#fff' },\n            hover: { background: style.color, border: '#fff' },\n          },\n          font: { color: 'rgba(255,255,255,0.75)', size: 11, face: '-apple-system, sans-serif' },\n          borderWidth: 0,\n          borderWidthSelected: 2,\n          // Store metadata for generic public-safe tooltip text\n          _type: n.type || 'unknown',\n          _connections: conns,\n        };\n      }));\n\n      const visEdges = new vis.DataSet(edges.map(e =\u003e {\n        const implicit = e.implicit === true;\n        return {\n          from: e.from,\n          to: e.to,\n          color: {\n            color: implicit ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.15)',\n            highlight: 'rgba(255,255,255,0.4)',\n            hover: 'rgba(255,255,255,0.3)',\n          },\n          dashes: implicit ? [4, 4] : false,\n          width: implicit ? 0.5 : 0.8,\n          smooth: { type: 'continuous', roundness: 0.2 },\n        };\n      }));\n\n      // --- Network Options ---\n      const options = {\n        nodes: {\n          scaling: {\n            label: { enabled: true, min: 14, max: 22, drawThreshold: 9 },\n          },\n        },\n        edges: {\n          selectionWidth: 1.5,\n          hoverWidth: 0.5,\n        },\n        physics: {\n          solver: 'barnesHut',\n          barnesHut: {\n            gravitationalConstant: -3000,\n            springLength: 200,\n            springConstant: 0.02,\n            damping: 0.15,\n          },\n          stabilization: {\n            enabled: true,\n            iterations: 150,\n            updateInterval: 15,\n          },\n          // Keep gently floating after stabilization\n          minVelocity: 0.3,\n          maxVelocity: 8,\n        },\n        interaction: {\n          hover: true,\n          tooltipDelay: 9999999,  // Disable built-in tooltips\n          zoomView: true,\n          dragView: true,\n          dragNodes: true,\n          navigationButtons: false,\n          keyboard: false,\n        },\n        layout: { improvedLayout: true },\n      };\n\n      // --- Create Network ---\n      const container = document.getElementById('graph');\n      const network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, options);\n\n      // --- Stabilization Progress ---\n      network.on('stabilizationProgress', (p) =\u003e {\n        const pct = Math.round((p.iterations / p.total) * 100);\n        progressEl.textContent = `Stabilizing… ${pct}%`;\n      });\n\n      network.on('stabilizationIterationsDone', () =\u003e {\n        // Fade out loader\n        loaderEl.classList.add('hidden');\n        setTimeout(() =\u003e { loaderEl.style.display = 'none'; }, 700);\n\n        // Show UI elements\n        document.getElementById('stats').classList.add('visible');\n        document.getElementById('legend').classList.add('visible');\n      });\n\n      // --- Populate Stats Badge ---\n      const nodeCount = nodes.length;\n      const edgeCount = edges.length;\n      const snapshotDate = data.generated\n        ? new Date(data.generated).toLocaleDateString('en-US', {\n            month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC',\n          })\n        : 'date unavailable';\n      document.getElementById('stats').textContent = `${nodeCount} connected · ${edgeCount} links · ${unlinkedCount} unlinked omitted · ${snapshotDate}`;\n\n      // --- Populate Legend (only types present in data) ---\n      const typesPresent = new Map();\n      nodes.forEach(n =\u003e {\n        const t = (n.type || '').toLowerCase();\n        if (!typesPresent.has(t)) {\n          const s = getStyle(t);\n          typesPresent.set(t, s);\n        }\n      });\n\n      const legendEl = document.getElementById('legend');\n      // Deduplicate by label (research variants merge)\n      const legendSeen = new Set();\n      typesPresent.forEach((style, type) =\u003e {\n        if (legendSeen.has(style.label)) return;\n        legendSeen.add(style.label);\n        const item = document.createElement('div');\n        item.className = 'legend-item';\n        item.innerHTML = `\u003cspan class=\"legend-dot\" style=\"background:${style.color}\"\u003e\u003c/span\u003e${style.label}`;\n        legendEl.appendChild(item);\n      });\n\n      // =======================================================================\n      // Interactivity\n      // =======================================================================\n      const tooltipEl = document.getElementById('tooltip');\n      const ttName = document.getElementById('tt-name');\n      const ttType = document.getElementById('tt-type');\n      let highlightActive = false;\n\n      // --- Hover: highlight node + neighbors, dim the rest ---\n      network.on('hoverNode', (e) =\u003e {\n        highlightActive = true;\n        const nodeId = e.node;\n        const connectedNodes = network.getConnectedNodes(nodeId);\n        const connectedEdges = network.getConnectedEdges(nodeId);\n        const allNodeIds = visNodes.getIds();\n        const allEdgeIds = visEdges.getIds();\n\n        // Dim all nodes\n        const nodeUpdates = allNodeIds.map(id =\u003e {\n          const isHighlighted = id === nodeId || connectedNodes.includes(id);\n          return { id, opacity: isHighlighted ? 1.0 : 0.12 };\n        });\n        visNodes.update(nodeUpdates);\n\n        // Dim all edges\n        const connectedEdgeSet = new Set(connectedEdges);\n        const edgeUpdates = allEdgeIds.map(id =\u003e ({\n          id, hidden: !connectedEdgeSet.has(id),\n        }));\n        visEdges.update(edgeUpdates);\n      });\n\n      network.on('blurNode', () =\u003e {\n        if (!highlightActive) return;\n        highlightActive = false;\n        // Restore all nodes\n        visNodes.update(visNodes.getIds().map(id =\u003e ({ id, opacity: 1.0 })));\n        // Restore all edges\n        visEdges.update(visEdges.getIds().map(id =\u003e ({ id, hidden: false })));\n      });\n\n      // --- Click: show tooltip near node ---\n      network.on('click', (e) =\u003e {\n        if (e.nodes.length \u003e 0) {\n          const nodeId = e.nodes[0];\n          const nodeData = visNodes.get(nodeId);\n          const style = getStyle(nodeData._type);\n          const connectionLabel = nodeData._connections === 1 ? '1 connection' : `${nodeData._connections} connections`;\n          ttName.textContent = `${style.label} node`;\n          ttType.textContent = connectionLabel;\n          // Position tooltip at click location\n          tooltipEl.style.left = e.event.center.x + 'px';\n          tooltipEl.style.top = (e.event.center.y - 12) + 'px';\n          tooltipEl.classList.add('visible');\n        } else {\n          tooltipEl.classList.remove('visible');\n        }\n      });\n\n      // Hide tooltip on drag/zoom\n      network.on('dragStart', () =\u003e tooltipEl.classList.remove('visible'));\n      network.on('zoom', () =\u003e tooltipEl.classList.remove('visible'));\n\n      // --- Double-click: zoom to neighborhood ---\n      network.on('doubleClick', (e) =\u003e {\n        if (e.nodes.length \u003e 0) {\n          const nodeId = e.nodes[0];\n          const neighbors = network.getConnectedNodes(nodeId);\n          const fitNodes = [nodeId, ...neighbors];\n          network.fit({ nodes: fitNodes, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });\n        }\n      });\n\n      // Disable right-click context menu\n      container.addEventListener('contextmenu', (e) =\u003e e.preventDefault());\n\n    })();\n  \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"]
